<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desenho · Hoje com tudo da Meu dia</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F7F5;--cd:#FFFFFF;--tx:#1F2328;--mu:#6B7075;--ln:#E6E6E2;--soft:#F0F0EC;--ac:#2F5D62;--on:#FFFFFF;--late:#B4553F}
.escuro{--bg:#1C1D20;--cd:#232428;--tx:#D9DADC;--mu:#9A9CA1;--ln:#303136;--soft:#2A2B30;--ac:#8DB3B0;--on:#1C1D20;--late:#D58C78}
*{box-sizing:border-box}
body{margin:0;font-family:Geist,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;transition:background .3s,color .3s}
.top{display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--bg);z-index:5}
.top b{font-size:15px;white-space:nowrap}.top>*{flex-shrink:0}.top .mu{white-space:nowrap}
.mu{color:var(--mu)}
.late{color:var(--late)}
.btn{font:inherit;font-size:13px;padding:7px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--cd);color:var(--tx);cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--ac);color:var(--on);border-color:var(--ac)}
.btn.lnk{border:none;background:none;color:var(--mu);padding:6px 6px}
.btn.lnk:hover{color:var(--tx)}
.busca{display:flex;align-items:center;gap:8px;border:1px solid var(--ln);background:var(--cd);border-radius:10px;padding:7px 12px;color:var(--mu);min-width:170px;font-size:13px;white-space:nowrap}
.kbd{margin-left:auto;font-size:11px;border:1px solid var(--ln);border-radius:5px;padding:0 5px}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px}
.tabs button{font:inherit;font-size:13px;padding:7px 14px;border-radius:9px;border:none;background:none;color:var(--mu);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--cd);color:var(--tx);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.wrap{max-width:1000px;margin:0 auto;padding:26px 22px 70px}
.wrap.n{max-width:760px}
h1{font-size:30px;font-weight:600;letter-spacing:-0.02em;margin:0}
.sub{color:var(--mu);margin:6px 0 20px}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:16px 18px;position:relative}
.passos{display:flex;gap:6px;margin-bottom:18px}
.passos i{flex:1;height:4px;border-radius:4px;background:var(--ln)}
.passos i.f{background:var(--ac)}
.n{font-size:12px;color:var(--mu);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.big{font-size:21px;font-weight:600;letter-spacing:-0.01em;margin:0 0 6px}
.lista{margin:12px 0 0;padding:0;list-style:none}
.lista li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--ln)}
.lista li .h{width:64px;color:var(--mu);font-variant-numeric:tabular-nums;flex:none;font-size:13px}
.lista li .x{flex:1;min-width:0}
.av{width:22px;height:22px;border-radius:50%;background:var(--soft);color:var(--mu);display:inline-grid;place-items:center;font-size:9px;font-weight:600;flex:none;border:1px solid var(--ln)}
.ponto{width:6px;height:6px;border-radius:50%;background:var(--late);display:inline-block;flex:none}
.acoes{display:flex;gap:8px;margin-top:16px;align-items:center}
.nota{width:100%;border:1px solid var(--ln);border-radius:12px;padding:10px 12px;font:inherit;background:var(--bg);color:var(--tx);resize:none}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--ln);cursor:pointer}
.chk .b{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--mu);flex:none;margin-top:1px;display:grid;place-items:center;font-size:11px}
.chk.on .b{background:var(--ac);border-color:var(--ac);color:var(--on)}
.cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:14px;align-items:start}
.pilha{display:flex;flex-direction:column;gap:14px}
.pill{display:inline-block;font-size:12px;color:var(--mu);border:1px solid var(--ln);border-radius:8px;padding:3px 8px;margin:3px 4px 0 0;cursor:pointer}
.ex{font-size:12px;color:var(--mu);border-left:2px solid var(--ln);padding-left:10px;margin-top:22px;line-height:1.6}
.lt{display:none;min-width:17px;height:17px;padding:0 4px;border-radius:5px;background:#E9DFC8;color:#4A3B17;font-size:10px;font-weight:700;place-items:center}
.letras .lt{display:inline-grid}
.mais{display:none}
.aberto .mais{display:block}
.menu{position:fixed;left:0;top:0;bottom:0;width:250px;background:var(--cd);border-right:1px solid var(--ln);padding:16px 12px;transform:translateX(-102%);transition:transform .25s;z-index:20;overflow:auto}
.menu.on{transform:none}
.menu .g{font-size:12px;color:var(--mu);margin:14px 8px 4px}
.menu .i{padding:6px 8px;border-radius:8px;font-size:13px}
.menu .i.on{background:var(--soft);font-weight:600}
.sombra{position:fixed;inset:0;background:rgba(0,0,0,.15);z-index:19;display:none}
.sombra.on{display:block}
.linha{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.barra{height:6px;border-radius:6px;background:var(--soft);overflow:hidden;width:110px;display:inline-block}
.barra i{display:block;height:100%;background:var(--ac)}
.post{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--ln)}
.post .c{width:8px;height:8px;border-radius:2px;margin-top:6px;flex:none}
</style>
</head>
<body>
<div class="top"><button class="btn" id="bm">Menu</button><b>Mapa M&amp;P</b><span class="mu">· Hoje</span>
 <span class="busca"><span>Buscar ou pedir à Vera</span><span class="kbd">Ctrl K</span></span><span class="lt">A</span>
 <span style="flex:1"></span>
 <div class="tabs" id="tabs"><button data-t="manha" class="on">Começar o dia</button><button data-t="dia">Durante o dia</button><button data-t="fim">Encerrar o dia</button></div>
 <span style="flex:1"></span>
 <button class="btn" title="Criar">+ Criar</button><span class="lt">D</span><button class="btn lnk" title="Post-it, Chat e Pedidos">Recados 1</button><span class="lt">Y</span>
 <button class="btn" id="bl">Onde foi parar</button><button class="btn" id="modo">Escuro</button></div>
<div class="sombra" id="sb"></div>
<div class="menu" id="mn"></div>
<div class="wrap" id="w"></div>
<script>
const st={t:'manha',p:0,ok:{},fila:false};
const L=x=>`<span class="lt">${x}</span>`;
const PASSOS=[
 {k:'Onde você parou',t:()=>`<div class="big">Sexta você parou na revisão do contrato do caso de Família.</div><div class="mu">É o que você escreveu ao encerrar o dia. As 3 prioridades de hoje:</div><ul class="lista">${['Prioridade 1 escolhida na sexta','Prioridade 2 escolhida na sexta','Prioridade 3 escolhida na sexta'].map((x,i)=>`<li><span class="h">${i+1}</span><span class="x">${x}</span></li>`).join('')}</ul>`},
 {k:'Agenda de hoje',t:()=>`<div class="big">Nenhum compromisso seu hoje. A sala de reunião está livre.</div><div class="mu">O que vence hoje, já somado: 2 prazos, 1 tarefa e 1 lembrete atrasado.</div><ul class="lista"><li><span class="h">09:00</span><span class="x">Compromisso do Alan</span><span class="av">AL</span></li><li><span class="h">hoje</span><span class="x">2 prazos · 1 tarefa ${L('L')}</span><button class="btn lnk">Ver</button></li><li><span class="ponto"></span><span class="x">1 lembrete atrasado desde sexta ${L('N')}</span><button class="btn lnk">Ver</button></li><li><span class="h">sala</span><span class="x">Livre de segunda a sexta ${L('M')}</span><button class="btn lnk">Reservar</button></li></ul><div class="linha" style="margin-top:10px">${L('K')}<button class="btn lnk">+ Compromisso</button><button class="btn lnk">Abrir calendário</button></div>`},
 {k:'Prazos',t:()=>`<div class="big">6 protocolos da semana passada estão sem confirmação.</div><div class="mu">E a nova semana tem 16 prazos, 2 para hoje.</div><ul class="lista"><li><span class="ponto"></span><span class="x">Sem confirmação: P8, P13, P14, P15, P16, P17 · todos com o Alan ${L('E')}</span><button class="btn lnk">Abrir</button><button class="btn lnk" title="Cobrar Alan no WhatsApp, Copiar lista">⋯</button></li><li><span class="h">semana</span><span class="x"><span class="barra"><i style="width:0%"></i></span> 0 de 16 protocolados · 0 adiantados ${L('F')}</span><button class="btn lnk">Ver a semana</button></li><li><span class="h">próximo</span><span class="x">P1 · vence hoje</span><button class="btn lnk">Pasta</button><button class="btn lnk">Abrir e protocolar</button></li></ul>`},
 {k:'Recados',t:()=>`<div class="big">1 post-it novo para você e nenhum pedido esperando.</div><div class="mu">Os recados ficam numa lista curta. Clique para ler inteiro.</div><ul class="lista"><li><span class="av">EL</span><span class="x">Ideia Curso IA · da Ellen para todos ${L('B')}</span><button class="btn lnk">Ler</button><button class="btn lnk">Entendi</button></li><li><span class="av">GA</span><span class="x">4 post-its seus abertos para a equipe ${L('C')}</span><button class="btn lnk">Ver</button></li><li><span class="av">EV</span><span class="x">2 post-its do Evaldo para o Alan ainda não lidos</span><button class="btn lnk">Ver</button></li><li><span class="h">equipe</span><span class="x">O que mudou desde sexta: nada novo ${L('I')}</span></li><li><span class="h">aviso</span><span class="x mu">Nenhum aviso fixado ${L('H')}</span><button class="btn lnk">+ Fixar aviso</button></li></ul>`},
 {k:'Suas 3 decisões',t:()=>`<div class="big">Comece por estas 3.</div><div class="mu">Suas tarefas mais antigas da Caixa rápida. As outras ficam na fila.</div><ul class="lista">${['desde 04/11','desde 04/11','desde 05/11'].map((x,i)=>`<li><span class="ponto"></span><span class="x">Tarefa atrasada ${i+1} <span class="mu">${x}</span> ${i?'':L('G')}</span><button class="btn lnk">Feito</button><button class="btn lnk">Encaminhar</button><button class="btn lnk">Adiar</button></li>`).join('')}</ul><div class="mu" style="margin-top:10px">Na fila: 47 atrasadas, 71 abertas · <span style="text-decoration:underline;cursor:pointer">Ver a fila</span></div><div class="mu" style="margin-top:6px">Também esperando você: 18 passos para validar ${L('S')} · 1 ideia ${L('T')}</div>`}];
function manha(){const p=PASSOS[st.p];return `<div class="mu">Segunda, 30 de novembro · 08:10</div><h1>Bom dia, Gabriel.</h1><div class="sub">Cinco passos, uns três minutos. Depois o Mapa abre no seu dia de trabalho.</div>
<div class="passos">${PASSOS.map((_,i)=>`<i class="${i<=st.p?'f':''}"></i>`).join('')}</div>
<div class="cd"><div class="n">Passo ${st.p+1} de 5 · ${p.k}</div>${p.t()}
<div class="acoes">${st.p?'<button class="btn" id="ant">Voltar</button>':''}<span style="flex:1"></span><button class="btn lnk" id="pul">Pular tudo</button><button class="btn pri" id="prox">${st.p<4?'Próximo':'Começar o dia'}</button></div></div>
<div class="ex">A Vera pode ler cada passo em voz alta, como já faz no resumo de entrada. Simulação da segunda de manhã com os números reais da cópia de 27/11, sem nomes de clientes. Clique em "Onde foi parar" no topo para ver as letras da Meu dia de hoje.</div>`}
function dia(){const fila=['desde 04/11','desde 04/11','desde 05/11','desde 09/11','desde 13/11'];return `<div class="mu">Segunda, 30 de novembro</div><h1>Seu dia</h1><div class="sub">O que você escolheu de manhã, em ordem. O resto fica a um clique.</div>
<div class="cols">
 <div class="pilha">
  <div class="cd"><div class="n">Agora</div><div class="big" style="font-size:18px">Prioridade 1 escolhida na sexta</div><div class="acoes" style="margin-top:10px"><button class="btn pri">Feito</button><button class="btn">Encaminhar</button><button class="btn lnk">Adiar</button></div>
   <div class="n" style="margin-top:18px">Depois</div><ul class="lista" style="margin:0"><li><span class="x">Prioridade 2</span></li><li><span class="x">Prioridade 3</span></li></ul></div>
  <div class="cd ${st.fila?'aberto':''}"><div class="n">Caixa rápida ${L('G')}<span style="flex:1"></span><span>47 atrasadas · 71 abertas</span></div>
   <input class="nota" placeholder="Anotar: cliente: o que fazer #dono prazo !  · Enter grava">
   <ul class="lista">${fila.slice(0,st.fila?5:3).map((x,i)=>`<li><span class="ponto"></span><span class="x">Tarefa atrasada ${i+1} <span class="mu">${x}</span></span><button class="btn lnk">Feito</button><button class="btn lnk">Encaminhar</button><button class="btn lnk">Adiar</button></li>`).join('')}</ul>
   <div class="linha" style="margin-top:8px"><button class="btn lnk" id="bf">${st.fila?'Mostrar menos':'Ver a fila (71)'}</button><span style="flex:1"></span><button class="btn lnk">Folha do dia ▾</button><button class="btn lnk">Imprimir</button><button class="btn lnk">Colar lista do papel</button></div></div>
  <div class="cd"><div class="n">Post-its ${L('B')}${L('C')}<span style="flex:1"></span><span>1 novo · 8 abertos</span></div>
   ${[['#9DB9D6','PENDÊNCIAS Ellen e Gabriel','De Gabriel p/ todos · 14/10'],['#D9A3B4','Ideia Curso IA','De Ellen p/ todos · 09/11 · novo'],['#D9C68C','Foto dos cheques','De Evaldo p/ Alan · 17/11']].map(p=>`<div class="post"><span class="c" style="background:${p[0]}"></span><div style="flex:1;min-width:0"><div>${p[1]}</div><div class="mu" style="font-size:12px">${p[2]}</div></div><button class="btn lnk">Marcar feito</button></div>`).join('')}
   <div class="linha" style="margin-top:6px"><button class="btn lnk">Ver todos (8)</button><button class="btn lnk">+ Post-it</button></div></div>
 </div>
 <div class="pilha">
  <div class="cd"><div class="n">Agenda de hoje ${L('K')}${L('L')}${L('N')}</div><ul class="lista" style="margin:0"><li><span class="h">09:00</span><span class="x">Alan · compromisso</span></li><li><span class="h">hoje</span><span class="x mu">2 prazos · 1 tarefa</span></li><li><span class="ponto"></span><span class="x">1 lembrete atrasado</span></li><li><span class="h">sala</span><span class="x mu">Livre a semana toda ${L('M')}</span></li></ul></div>
  <div class="cd"><div class="n">Protocolo da semana ${L('E')}${L('F')}</div><div class="linha"><span class="barra"><i style="width:0%"></i></span><span>0 de 16</span><span class="mu">· 2 hoje</span></div><div class="mu" style="margin-top:6px">Próximo: P1 · hoje</div><div class="linha" style="margin-top:4px"><button class="btn lnk">Abrir e protocolar</button><button class="btn lnk">Ver a semana</button><button class="btn lnk" title="Cobrar Alan no WhatsApp">⋯</button></div><div class="late" style="font-size:13px;margin-top:4px"><span class="ponto"></span> 6 da semana passada sem confirmação</div></div>
  <div class="cd"><div class="n">Equipe agora ${L('Q')}</div><ul class="lista" style="margin:0"><li><span class="av">EL</span><span class="x">Ellen <span class="mu">· 9 atrasadas</span></span><button class="btn lnk">+ Post-it</button></li><li><span class="av">AL</span><span class="x">Alan <span class="mu">· 21 atrasadas</span></span><button class="btn lnk">+ Post-it</button></li><li><span class="av">EV</span><span class="x">Evaldo <span class="mu">· 1 atrasada</span></span><button class="btn lnk">+ Post-it</button></li></ul></div>
  <div class="cd"><div class="n">Cobranças de hoje ${L('O')}</div><div><span class="ponto"></span> 87 com alerta de prescrição</div><button class="btn lnk" style="padding-left:0">Abrir cobranças</button></div>
  <div class="cd"><div class="n">Atalhos ${L('X')}${L('D')}</div><span class="pill">Agenda da sala</span><span class="pill">+ Novo cliente</span><span class="pill">Nova ideia</span><span class="pill">Esteira</span><span class="pill">Fluxos</span><span class="pill">Manual (POP)</span><span class="pill">Trilha</span><span class="pill">Gestão</span></div>
 </div>
</div>
<div class="ex">Post-its viram uma lista curta com uma marca de cor; o Protocolo vira um cartão pequeno; a Caixa rápida mostra 3 e abre a fila quando você pede. Nada saiu do Mapa.</div>`}
const ABERTAS=[['Tarefa de hoje que ficou aberta','Adiar para amanhã'],['Tarefa atrasada que você tocou hoje','Adiar para amanhã'],['Post-it da Ellen sem resposta','Responder amanhã']];
function fim(){return `<div class="mu">Segunda, 30 de novembro · 18:20</div><h1>Encerrar o dia</h1><div class="sub">Dois minutos para amanhã começar sozinho.</div>
<div class="cd"><div class="n">1 · O que você fez hoje</div><div class="big" style="font-size:18px">4 tarefas concluídas, 2 encaminhadas, 1 prazo conferido.</div><div class="linha"><button class="btn lnk" style="padding-left:0">Copiar resumo do dia</button>${L('P')}</div></div>
<div class="cd" style="margin-top:12px"><div class="n">2 · O que ficou aberto</div>${ABERTAS.map((a,i)=>`<div class="chk ${st.ok[i]?'on':''}" data-i="${i}"><span class="b">${st.ok[i]?'✓':''}</span><span style="flex:1">${a[0]}</span><span class="mu">${a[1]} ▾</span></div>`).join('')}<div class="mu" style="margin-top:8px">Cada um vai para amanhã, para alguém da equipe, ou fica onde está.</div></div>
<div class="cd" style="margin-top:12px"><div class="n">3 · Suas 3 prioridades de amanhã</div><div class="mu" style="margin-bottom:6px">Sugestão: as mais antigas e o que vence amanhã. Troque se quiser.</div>${['Tarefa atrasada mais antiga','Prazo que vence amanhã','Tarefa que você adiou hoje'].map((x,i)=>`<div class="chk on"><span class="b">${i+1}</span><span>${x}</span></div>`).join('')}</div>
<div class="cd" style="margin-top:12px"><div class="n">4 · Onde você parou</div><textarea class="nota" style="min-height:64px" placeholder="Uma frase para você mesmo amanhã de manhã."></textarea></div>
<div class="cd" style="margin-top:12px"><div class="n">5 · Para a equipe ${L('H')}</div><div class="linha"><button class="btn lnk" style="padding-left:0">+ Fixar um aviso para amanhã</button><button class="btn lnk">+ Post-it</button></div></div>
<div class="cd" style="margin-top:12px"><div class="n">Na sexta ${L('J')}${L('W')}${L('U')}${L('V')}</div><div class="mu">Este passo também abre o "Fechar a semana" e o "Planejar a semana", que já existem, com a pauta da Reunião semanal, as pendências da equipe (4 de 15) e os números dos últimos 7 dias.</div></div>
<div class="acoes"><span style="flex:1"></span><button class="btn pri">Encerrar o dia</button></div>
<div class="ex">A Visão do gestor, os contadores e "Para você validar" ${L('P')}${L('S')}${L('T')} ficam em Gestão, no grupo Só sócios do menu. O aviso de versão ${L('R')} vira uma notinha que aparece uma vez.</div>`}
const MENU=[["Dia a dia",["Hoje","Agenda","Semana","Anotar","Tarefas","WhatsApp 9955"]],["Casos e prazos",["Atendimentos e casos","Prazos","Cobranças","Pessoas","Documentos","Processos administrativos"]],["Equipe",["Post-its","Lembretes","Pedidos","Chat da equipe","Bloco rápido","Sala de reunião"]],["Só sócios",["Gestão","Meu financeiro","Perfis da equipe"]],["Manuais e método",["Fluxos","Roteiros","Ideias"]],["Ajustes",["Aparência","Painel e dados","Importar dados","Instalar o app","Em breve"]]];
document.getElementById('mn').innerHTML='<b style="display:block;margin:0 8px 6px">Mapa M&amp;P</b><span class="lt" style="margin-left:8px">Z</span>'+MENU.map(g=>`<div class="g">${g[0]}</div>`+g[1].map(i=>`<div class="i ${i==='Hoje'?'on':''}">${i}</div>`).join('')).join('');
const mn=document.getElementById('mn'),sb=document.getElementById('sb');
document.getElementById('bm').onclick=()=>{mn.classList.add('on');sb.classList.add('on')};sb.onclick=()=>{mn.classList.remove('on');sb.classList.remove('on')};
function draw(){const w=document.getElementById('w');w.className='wrap'+(st.t==='dia'?'':' n');w.innerHTML=st.t==='manha'?manha():st.t==='dia'?dia():fim();
document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===st.t));
const nx=document.getElementById('prox');if(nx)nx.onclick=()=>{if(st.p<4){st.p++;draw()}else{st.t='dia';draw()}};
const an=document.getElementById('ant');if(an)an.onclick=()=>{st.p--;draw()};
const pu=document.getElementById('pul');if(pu)pu.onclick=()=>{st.t='dia';draw()};
const bf=document.getElementById('bf');if(bf)bf.onclick=()=>{st.fila=!st.fila;draw()};
document.querySelectorAll('.chk[data-i]').forEach(c=>c.onclick=()=>{st.ok[c.dataset.i]=!st.ok[c.dataset.i];draw()});}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{st.t=b.dataset.t;st.p=0;draw()});
document.getElementById('modo').onclick=()=>{const e=document.body.classList.toggle('escuro');document.getElementById('modo').textContent=e?'Claro':'Escuro'};
document.getElementById('bl').onclick=()=>{const on=document.body.classList.toggle('letras');document.getElementById('bl').textContent=on?'Esconder letras':'Onde foi parar'};
draw();
</script>
</body>
</html>
