function cbAll(){ if(!Array.isArray(S.cobrancas)) S.cobrancas=[]; S.cobrancas.forEach(cbFix); return S.cobrancas; }
function cbFix(c){ if(CB_ANTIGAS[c.etapa]) c.etapa=CB_ANTIGAS[c.etapa]; if(!CB_ETAPAS[c.etapa]) c.etapa="entrada"; if(!c.lim||typeof c.lim!=="object") c.lim={}; if(!c.regua||typeof c.regua!=="object") c.regua={inicio:"",env:{}}; if(!c.regua.env) c.regua.env={}; if(!c.kit||typeof c.kit!=="object") c.kit={}; if(!Array.isArray(c.hist)) c.hist=[]; if(!Array.isArray(c.pagtos)) c.pagtos=[]; }
function cbAcessoMap(){ if(!S.cobAcesso || typeof S.cobAcesso!=="object") S.cobAcesso={}; return S.cobAcesso; }
function cbPode(){ if(ui.papel==="master") return true; if(!ui.me) return false; return cbAcessoMap()[ui.me]!==false; }
function cbNum(v){ if(typeof v==="number") return v; let s=String(v||"").replace(/[^\d,.-]/g,""); if(s.includes(",")) s=s.replace(/\./g,"").replace(",","."); const n=parseFloat(s); return isFinite(n)?Math.round(n*100)/100:0; }
function brl(n){ return (Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function fmtIsoAno(s){ if(!s) return ""; const p=s.split("-"); return p.length===3 ? p[2]+"/"+p[1]+"/"+p[0] : s; }
function isoAdd(iso, dias, meses, anos){ const p=iso.split("-").map(Number); const d=new Date(p[0]+(anos||0), p[1]-1+(meses||0), p[2]+(dias||0)); return isoDia(d); }
function diasAte(iso){ const p=iso.split("-").map(Number); const a=new Date(p[0],p[1]-1,p[2]); const h=new Date(); h.setHours(0,0,0,0); return Math.round((a-h)/864e5); }
function cbJudicial(c){ return CB_ETAPAS[c.etapa].via==="judicial" || (c.etapa==="acordo" && c.via==="judicial"); }
function cbParcelas(c){ return (c.acordo && Array.isArray(c.acordo.parcelas)) ? c.acordo.parcelas : []; }
function cbRecebido(c){ return cbParcelas(c).filter(p=>p.pago).reduce((s,p)=>s+(+p.valor||0),0) + (c.pagtos||[]).reduce((s,p)=>s+(+p.valor||0),0); }
function cbDevido(c){ if(c.acordo && c.acordo.valor) return Math.max(0, c.acordo.valor - cbRecebido(c)); return Math.max(0, (c.valorAtual||c.valorOrig||0) - cbRecebido(c)); }
function cbPct(c){ return cbJudicial(c) ? (c.honorPctJud||c.honorPct||0) : (c.honorPct||0); }
function cbHonor(c){ return cbRecebido(c)*cbPct(c)/100; }
function cbAtivas(){ return cbAll().filter(c=>c.etapa!=="pago" && c.etapa!=="encerrada"); }
function cbParcVencidas(c){ const h=isoDia(); return cbParcelas(c).filter(p=>!p.pago && p.venc && p.venc<h); }
function cbParcHoje(c){ const h=isoDia(); return cbParcelas(c).filter(p=>!p.pago && p.venc===h); }
function cbAcaoVencida(c){ if(c.etapa==="acordo" && /^Conferir pagamento da parcela/.test(c.proxTxt||"") && (cbParcVencidas(c).length||cbParcHoje(c).length)) return false; return !!c.proxData && c.proxData<=isoDia() && c.etapa!=="pago" && c.etapa!=="encerrada"; }
function cbPrescAlerta(c){ if(!c.prescricao || c.etapa==="pago" || c.etapa==="encerrada" || c.etapa==="ajuizada" || c.etapa==="cumprimento") return null; const d=diasAte(c.prescricao); return d<=90 ? d : null; }
function cbAlertas(){ let n=0; cbAll().forEach(c=>{ n+=cbParcVencidas(c).length+cbParcHoje(c).length; if(cbAcaoVencida(c)) n++; if(cbPrescAlerta(c)!=null) n++; }); return n; }
function cbMesRecebido(){ const m=isoDia().slice(0,7); let v=0; cbAll().forEach(c=>{ cbParcelas(c).forEach(p=>{ if(p.pago && (p.pagoEm||"").slice(0,7)===m) v+=+p.valor||0; }); (c.pagtos||[]).forEach(p=>{ if((p.data||"").slice(0,7)===m) v+=+p.valor||0; }); }); return v; }
function cbMesHonor(){ const m=isoDia().slice(0,7); let v=0; cbAll().forEach(c=>{ const pct=cbPct(c)/100; cbParcelas(c).forEach(p=>{ if(p.pago && (p.pagoEm||"").slice(0,7)===m) v+=(+p.valor||0)*pct; }); (c.pagtos||[]).forEach(p=>{ if((p.data||"").slice(0,7)===m) v+=(+p.valor||0)*pct; }); }); return v; }
function cbHist(c, txt){ c.hist.unshift({id:uid(), t:Date.now(), quem:ui.me||"?", txt}); }

/* ---------- prescrição sugerida (conferir sempre) ---------- */
function cbPrescSug(c){
  if(!c.venc) return null; const v=c.venc;
  if(c.doc==="Nota promissória") return {d:isoAdd(v,0,0,3), t:"execução: 3 anos do vencimento (LUG art. 70). Depois: locupletamento ou monitória (5 anos, Súm. 504/STJ)."};
  if(c.doc==="Cheque") return {d:isoAdd(isoAdd(v,30),0,6), t:"execução: 6 meses após a apresentação (30 dias, mesma praça; 60 se outra praça). Use a data de emissão no vencimento. Depois: locupletamento 2 anos; monitória 5 anos (Súm. 503/STJ)."};

/* ---------- lacunas da ficha (gate C0) ---------- */

function cbVer(id){

function cbForaLimite(c, tot, ent, n){

  if(L.parc && n > L.parc) out.push("mais de "+L.parc+" parcelas");
  return out;
}

/* ================= PAINEL M&P: Central de controle, Tarefas, Prazos fatais, Bloco rápido ================= */
const TF_AREAS = {"00":"Empresa · Fundação","01":"Contencioso","02":"Clientes empresariais","03":"Cobranças","04":"Modelos · OpMaster","05":"Gestão interna"};

const BLOCOS_HORA = ["11:00","16:30"];
ui.tf = {area:"", resp:"", st:"abertas"}; ui.bq = {f:"abertas"}; ui.pz = {};
if(typeof PN_PAG==="object"){ PN_PAG.central="Central"; PN_PAG.tarefas="Tarefas"; PN_PAG.prazos="Prazos fatais"; PN_PAG.bloco="Bloco rápido"; PN_PAG.cobrancas="Cobranças"; }
function tfAll(){ if(!Array.isArray(S.tarefas)) S.tarefas=[]; return S.tarefas; }
function pzAll(){ if(!Array.isArray(S.prazos)) S.prazos=[]; return S.prazos; }
function bqAll(){ if(!Array.isArray(S.bloco)) S.bloco=[]; return S.bloco; }
function tfMinha(t){ return t.resp===ui.me || (t.resp==="Sócios" && isApprover() && ui.me!=="Ellen"); }
function tfAtrasada(t){ return !t.done && t.data && t.data<isoDia(); }
function pzDias(p){ return p.data ? diasAte(p.data) : null; }
function pzRisco(){ return pzAll().filter(p=>!p.done && p.data && pzDias(p)<=7); }
function pzLabel(p){ const d=pzDias(p); if(d===null) return "sem data"; if(d<0) return "vencido há "+(-d)+(d===-1?" dia":" dias"); if(d===0) return "vence hoje"; if(d===1) return "amanhã"; return "em "+d+" dias"; }
function pzCls(p){ const d=pzDias(p); if(d===null) return "nd"; if(d<=1) return "crit"; if(d<=7) return "warn"; return ""; }
function rcParaMim(p){ if(!ui.me) return false; if(p.quem===ui.me) return false; const pa=p.para||"Todos"; return pa==="Todos" || pa===ui.me || (pa==="Sócios" && isApprover() && ui.me!=="Ellen"); }
function rcDecisoes(){ return (S.pedidos||[]).filter(p=>p.status!=="atendido" && (p.tipo==="decisao"||p.tipo==="urgente") && (rcParaMim(p) || p.quem===ui.me)); }
function rcAbertosMim(){ return (S.pedidos||[]).filter(p=>p.status!=="atendido" && rcParaMim(p)); }
function proxBloco(){ const n=new Date(); for(const h of BLOCOS_HORA){ const [hh,mm]=h.split(":").map(Number); const d=new Date(n); d.setHours(hh,mm,0,0); if(d>n) return {h, min:Math.round((d-n)/60000)}; } return {h:BLOCOS_HORA[0]+" de amanhã", min:null}; }
function durTxt(min){ if(min==null) return ""; const h=Math.floor(min/60), m=min%60; return "em "+(h?h+" h ":"")+(m?m+" min":"").trim(); }
function saudacao2(){ const h=new Date().getHours(); return h<12?"Bom dia":h<18?"Boa tarde":"Boa noite"; }

/* ---------- Central de controle ---------- */
function rcLinha(p){
  const tp=PD_TIPOS[p.tipo]||PD_TIPOS.pedido; const visto=(p.vistoPor||[]).includes(ui.me);
  return `<div class="rc-row${p.tipo==="urgente"?" urg":""}">
    <div class="rc-meta"><span class="rc-tipo" style="--pc:${tp.c}">${esc(tp.n)}</span><span>${esc(p.quem)} → ${esc(p.para||"Todos")}</span><span class="muted">${esc(fmtDur(Date.now()-(p.t||0)))} atrás</span>${p.caso?`<span class="rc-caso">${esc(p.caso)}</span>`:""}${(p.vistoPor||[]).length?`<span class="muted">visto por ${esc(p.vistoPor.join(", "))}</span>`:""}</div>

function viewCentral(){

  const resumo=[dec.length?`${dec.length} ${dec.length===1?"decisão":"decisões"} para o bloco`:"", risco.length?`${risco.length} ${risco.length===1?"prazo":"prazos"} nos próximos 7 dias`:"", minhas.length?`${minhas.length} ${minhas.length===1?"tarefa sua":"tarefas suas"} em aberto`:""].filter(Boolean);
  return `<div class="phead cx-head"><div><h1>${saudacao2()}, ${esc(ui.me||"")}</h1><p>${resumo.length?"Você tem "+resumo.join(", ").replace(/, ([^,]*)$/," e $1")+".":"Nada pendente com você agora."}</p></div><span class="cx-date">${esc(dia)}</span></div>

    <div class="cx-cols">

        ${prox14.length?prox14.map(p=>`<div class="pz-li ${pzCls(p)}"><span class="pz-d">${esc(fmtIso(p.data))}</span><span class="pz-c"><b>${esc(p.caso)}</b>${p.acao?`<small>${esc(p.acao)}</small>`:""}</span><span class="pz-pill">${esc(pzLabel(p))}</span></div>`).join(""):`<p class="cx-empty">Nenhum prazo nos próximos 14 dias.</p>`}
        ${semData.length?`<p class="cx-warn">${semData.length} prazo(s) sem data confirmada.</p>`:""}</section>

function tfLegadoLer(txt){
  const i=txt.indexOf("function buildDefault()"); if(i<0){ toast("Não encontrei as pendências nesse arquivo. Escolha o PLATAFORMA_2a.html."); return; }
  const seg=txt.slice(i, i+20000); const T=[], P=[];
  const reA=/(a\d\d):\{nome:'([^']*)',num:'(\d\d)',tasks:\[([\s\S]*?)\]\}/g; let m;
  while((m=reA.exec(seg))){ const reT=/txt:'([^']*)',resp:'([^']*)',data:'([^']*)',done:(true|false)/g; let t; while((t=reT.exec(m[4]))) T.push({area:m[3], txt:t[1], resp:t[2], data:t[3], done:t[4]==="true"}); }
  const reP=/caso:'([^']*)',data:'([^']*)',acao:'([^']*)',done:(true|false)/g; let p; while((p=reP.exec(seg))) P.push({caso:p[1], data:p[2], acao:p[3], done:p[4]==="true"});
  if(!T.length && !P.length){ toast("Não encontrei pendências nesse arquivo."); return; }
  confirmBox("Trazer da Plataforma antiga?", `Encontrei ${T.length} tarefa(s) e ${P.length} prazo(s). Depois é só revisar, concluir ou excluir o que já passou.`, "Trazer", ()=>{
    snap(); T.forEach(t=>tfAll().push({id:uid(), t:Date.now(), quem:"Plataforma", area:t.area, txt:t.txt, resp:TF_RESP.includes(t.resp)?t.resp:"Sócios", data:t.data||"", done:t.done, obs:""})); P.forEach(x=>pzAll().push({id:uid(), t:Date.now(), quem:"Plataforma", caso:x.caso, data:x.data||"", acao:x.acao||"", resp:"Alan", done:x.done}));
    S.legadoImportado=true; logA("trouxe as pendências da Plataforma antiga"); save(); render(); toast("Pendências trazidas. Revise as que já passaram."); });
}

const RX_CNJ=/\b\d{7}-\d{2}\.\d{4}\.\d\.\d{2}\.\d{4}\b/;
function bqData(s){ const m=s.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/); if(!m) return ""; const y=m[3]?(m[3].length===2?"20"+m[3]:m[3]):String(new Date().getFullYear()); const d=new Date(+y, +m[2]-1, +m[1]); return isNaN(d)?"":isoDia(d); }
function bqParse(txt){ const out=[]; let urg=false; txt.split(/\n/).forEach(l=>{ const s=l.trim().replace(/^[-•*·]\s*/,""); if(!s) return; if(/^[A-ZÇÃÕÉÊÁÍÓÚ ]{4,}:$/.test(s)){ urg=/URGENT/.test(s); return; }
  const cnj=(s.match(RX_CNJ)||[""])[0]; out.push({id:uid(), t:Date.now(), quem:ui.me||"?", txt:s, urg:urg||/urgente/i.test(s), cnj, data:bqData(s.replace(RX_CNJ,"")), done:false}); }); return out; }

/* ---------- Calendário ---------- */
function calItens(iso){
  const it=[];
  evAll().filter(e=>e.data===iso).forEach(e=>it.push({k:"ev", id:e.id, h:e.hora||"", t:e.titulo, sub:(EV_TIPOS[e.tipo]||"")+(e.pessoa?" · "+psNome(e.pessoa):"")+(e.pasta?" · 📁 pasta":""), r:e.resp}));
  tfLista().filter(t=>!t.done && (t.data===iso || t.dataComp===iso)).forEach(t=>it.push({k:"tf", id:t.id, h:"", t:t.txt, sub:t.data===iso?"Data fatal":"Compromisso", r:t.resp, fatal:t.data===iso}));
  pzAll().filter(p=>!p.done && p.data===iso).forEach(p=>it.push({k:"pz", id:p.id, h:"", t:p.caso, sub:"Prazo fatal", r:p.resp, fatal:true}));
  if(typeof lmAll==="function") lmAll().filter(l=>lmDue(l,iso) && !lmFeito(l,iso) && (l.para==="Todos"||l.para===ui.me||isApprover())).forEach(l=>it.push({k:"lm", id:l.id, h:l.hora||"", t:l.titulo, sub:"Lembrete", r:l.para, rec:l.repetir!=="nao"}));
  if(typeof cbAll==="function" && cbPode()) cbAll().forEach(c=>cbParcelas(c).filter(p=>!p.pago && p.venc===iso).forEach(p=>it.push({k:"cb", id:c.id, h:"", t:"Parcela "+p.n+" · "+c.devedor, sub:"Cobrança · "+brl(p.valor), r:c.resp})));
  if(typeof admCal==="function") admCal(iso).forEach(x=>it.push(x));
  if(typeof salaCal==="function") salaCal(iso).forEach(x=>it.push(x));
  return it.sort((a,b)=>(a.h||"99").localeCompare(b.h||"99"));
}

/* ---------- Painel de gestão ---------- */
function viewPainel(){
  const meus=ui.pg.meus, h=isoDia();
  const T=tfLista().filter(t=>!t.done && meuFiltro(t.resp)), Tatr=T.filter(t=>t.data && t.data<h);
  const P=pzAll().filter(p=>!p.done && meuFiltro(p.resp)), P7=P.filter(p=>p.data && pzDias(p)<=7);
  const C=csAll().filter(c=>!csFim(c) && meuFiltro(c.resp));
  const dec=rcDecisoes(), pdAb=(S.pedidos||[]).filter(p=>p.status!=="atendido" && (!meus||rcParaMim(p)||p.quem===ui.me));
  const cba = typeof cbPode==="function" && cbPode() ? cbAlertas() : null;
  const sem0=lmIsoDate(h); sem0.setDate(sem0.getDate()-sem0.getDay()); const semana=[...Array(7)].map((_,i)=>{ const d=new Date(sem0); d.setDate(d.getDate()+i); return isoDia(d); });
  const evSem=semana.reduce((n,d)=>n+evAll().filter(e=>e.data===d && meuFiltro(e.resp)).length,0);
  const ind=(lab,v,go,al)=>`<button class="ind${al&&v?" al":""}" ${go}><span>${lab}</span><b>${v}</b></button>`;
  const aba=ui.pg.aba;
  const nasc=psAll().filter(p=>p.nasc && p.nasc.slice(5)===h.slice(5));
  const alertas = aba==="tarefas" ? (Tatr.length?Tatr.sort((a,b)=>a.data.localeCompare(b.data)).slice(0,8).map(tfLi2).join(""):`<p class="muted pf-v">Nenhuma tarefa atrasada.</p>`)
    : aba==="prazos" ? (P7.length?P7.sort((a,b)=>a.data.localeCompare(b.data)).map(p=>`<div class="pz-li ${pzCls(p)}" data-act="pzEdit" data-id="${p.id}"><span class="pz-d">${esc(fmtIso(p.data))}</span><span class="pz-c"><b>${esc(p.caso)}</b>${p.acao?`<small>${esc(p.acao)}</small>`:""}</span><span class="pz-pill">${esc(pzLabel(p))}</span></div>`).join(""):`<p class="muted pf-v">Nenhum prazo nos próximos 7 dias.</p>`)
    : (nasc.length?nasc.map(p=>`<div class="pf-li" data-act="psAbrir" data-id="${p.id}"><b>${esc(p.nome)}</b><span class="muted">faz aniversário hoje</span></div>`).join(""):`<p class="muted pf-v">Nenhum aniversário hoje.</p>`);
  const dsel=ui.pg.dia; let ag=calItens(dsel).filter(x=>meuFiltro(x.r)||x.k==="lm");
  const atrasadas = ui.pg.ocultaAtr ? [] : tfLista().filter(t=>!t.done && t.data && t.data<h && meuFiltro(t.resp) && dsel===h);
  const pnM=(typeof pnAll==="function")?pnAll().filter(n=>!n.feito && (pnParaMim(n)||(!meus&&isApprover()))).sort((a,b)=>(pnNovo(b)-pnNovo(a))||(b.t-a.t)):[];
  const parts={
    postits:()=>`${pnM.length?`<div class="pg-pn"><div class="pf-bh"><h3>Post-its</h3><button class="lnk" data-go="postits">Ver todos</button></div><div class="pn-grid">${pnM.slice(0,6).map(n=>pnMini(n,true)).join("")}</div></div>`:""}`,
    indicadores:()=>`<section class="pg-sec"><div class="pf-bh"><h3>Indicadores</h3><span class="muted" style="font-size:12.5px">Próximo bloco de decisão: <b>${esc(proxBloco().h)}</b></span></div><div class="inds">
      ${ind("Tarefas não concluídas", T.length, 'data-go="tarefas"', false)}${ind("Tarefas atrasadas", Tatr.length, 'data-go="tarefas"', true)}${ind("Prazos em 7 dias", P7.length, 'data-go="prazos"', true)}${ind("Casos ativos", C.length, 'data-go="casos"', false)}${ind("Compromissos na semana", evSem, 'data-go="calendario"', false)}${ind("Pedidos em aberto", pdAb.length, 'data-act="pdToggle"', false)}${cba!==null?ind("Cobranças com alerta", cba, 'data-go="cobrancas"', true):""}
    </div></section>`,
    alertas:()=>`<section class="pg-sec"><div class="pf-bh"><h3>Alertas</h3></div><div class="tabs sm">${[["tarefas","Tarefas ("+Tatr.length+")"],["prazos","Prazos ("+P7.length+")"],["aniv","Aniversários ("+nasc.length+")"]].map(([k,n])=>`<button class="${aba===k?"on":""}" data-act="pgAba" data-v="${k}">${n}</button>`).join("")}</div>${alertas}</section>`,
    decisao:()=>`<section class="pg-sec"><div class="pf-bh"><h3>Bloco de decisão <span class="muted" style="font-weight:400;font-size:12.5px">${BLOCOS_HORA.join(" e ")}</span></h3><button class="lnk" data-act="rcNovoDec">Novo pedido</button></div>${dec.length?dec.sort((a,b)=>(b.tipo==="urgente")-(a.tipo==="urgente")||(a.t-b.t)).slice(0,4).map(rcLinha).join(""):`<p class="muted pf-v">Nada esperando decisão.</p>`}</section>`,
    agenda:()=>`<section class="pg-sec"><div class="pf-bh"><h3>Agenda da semana</h3><label class="check" style="font-size:13px"><input type="checkbox" data-act="pgOculta" ${ui.pg.ocultaAtr?"checked":""}> Ocultar atividades atrasadas</label></div>
      <div class="wk">${semana.map(d=>{ const n=calItens(d).filter(x=>meuFiltro(x.r)||x.k==="lm").length; return `<button class="wk-d${d===dsel?" on":""}${d===h?" hj":""}" data-act="pgDia" data-d="${d}"><span>${["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"][lmIsoDate(d).getDay()]}</span><b>${+d.slice(8)}</b>${n?`<i>${n}</i>`:""}</button>`; }).join("")}</div>
      ${atrasadas.length?`<div class="wk-atr"><span class="muted">Atrasadas</span>${atrasadas.sort((a,b)=>a.data.localeCompare(b.data)).slice(0,6).map(t=>`<div class="ag-it late" data-act="tfEdit2" data-id="${t.id}"><span class="st-pendente">Pendente</span><b>${esc(t.txt)}</b><small>Data fatal: ${esc(fmtIsoAno(t.data))} · <span class="lt">${esc(diasTxt(diasAte(t.data)))}</span></small>${respInic(t.resp)}</div>`).join("")}</div>`:""}
      ${ag.length?ag.map(calLi).join(""):`<p class="muted pf-v">Nada para ${dsel===h?"hoje":esc(fmtIso(dsel))}.</p>`}</section>`,
    casos:()=>`<section class="pg-sec"><div class="pf-bh"><h3>Casos ativos</h3><button class="lnk" data-go="casos">Ver funil</button></div>${C.length?C.sort((a,b)=>(b.movidoEm||b.t)-(a.movidoEm||a.t)).slice(0,6).map(c=>`<div class="pf-li" data-act="csAbrir" data-id="${c.id}"><b>${esc(c.titulo)}</b><span class="muted">${esc(psNome(c.pessoa))}</span><span class="tag">${esc(csColNome(c))}</span></div>`).join(""):`<p class="muted pf-v">Nenhum caso ativo.</p>`}</section>`,
    admin:()=>typeof admPainel==="function"?admPainel():"",
    prazos:()=>`<section class="pg-sec"><div class="pf-bh"><h3>Prazos fatais</h3><button class="lnk" data-go="prazos">Ver todos</button></div>${P.filter(p=>p.data).sort((a,b)=>a.data.localeCompare(b.data)).slice(0,6).map(p=>`<div class="pz-li ${pzCls(p)}" data-act="pzEdit" data-id="${p.id}"><span class="pz-d">${esc(fmtIso(p.data))}</span><span class="pz-c"><b>${esc(p.caso)}</b></span><span class="pz-pill">${esc(pzLabel(p))}</span></div>`).join("")||`<p class="muted pf-v">Nenhum prazo em aberto.</p>`}</section>`
  };
  const ord=pgBlocos(); let html="", buf=[];
  const flush=()=>{ if(buf.length===1) html+=buf[0]; else if(buf.length) html+=`<div class="pg-2">${buf.join("")}</div>`; buf=[]; };
  ord.filter(b=>b.on && parts[b.k]).forEach(b=>{ const h2=parts[b.k](); if(!h2) return; if(b.meia){ buf.push(h2); if(buf.length===2) flush(); } else { flush(); html+=h2; } }); flush();
  return `<div class="phead"><div><div class="crumb">Painel de gestão</div><h1>${saudacao2()}, ${esc(ui.me||"")}</h1></div><div class="row" style="gap:8px"><button class="btn sm" data-act="pgPerso">Personalizar painel</button><div class="seg"><button class="${!meus?"on":""}" data-act="pgMeus" data-v="0">Dados gerais</button><button class="${meus?"on":""}" data-act="pgMeus" data-v="1">Meus dados</button></div></div></div>`+html;
}

  const it=[["tfNova","Tarefa"],["evNovo","Compromisso"],["psNova","Pessoa"],["csNovo","Caso"],["pzNovoM","Prazo fatal"],["pnNovo","Post-it"],["rcNovoDec","Pedido"],["lmNovo","Lembrete"]].concat(typeof cbPode==="function"&&cbPode()?[["cbNova","Cobrança"]]:[]);
  modal("Criar", `<div class="cr-g">${it.map(([a,n])=>`<button class="cr-b" data-act="${a}" data-crm="1">${esc(n)}</button>`).join("")}</div>`, [{label:"Fechar"}]);

function topoInit(){
  if($("#criarBtn")) return; const top=$(".top"); if(!top) return;
  const s=top.querySelector(".search"); if(s) s.insertAdjacentHTML("afterend", `<button class="btn primary sm" id="criarBtn" data-act="criar">${ic("plus",14)} Criar</button>`);

/* ---------- drag and drop (funil e quadro de tarefas) ---------- */
document.addEventListener("dragstart", e=>{ const c=e.target.closest && e.target.closest("[data-drag]"); if(!c) return; e.dataTransfer.setData("text/plain", c.dataset.drag+":"+c.dataset.id); e.dataTransfer.effectAllowed="move"; c.classList.add("dragging"); });
document.addEventListener("dragend", e=>{ $$(".dragging").forEach(x=>x.classList.remove("dragging")); $$(".kb-col.over").forEach(x=>x.classList.remove("over")); });
document.addEventListener("dragover", e=>{ const col=e.target.closest && e.target.closest("[data-drop]"); if(!col) return; e.preventDefault(); $$(".kb-col.over").forEach(x=>x!==col&&x.classList.remove("over")); col.classList.add("over"); });
document.addEventListener("drop", e=>{ const col=e.target.closest && e.target.closest("[data-drop]"); if(!col) return; e.preventDefault(); const [k,id]=(e.dataTransfer.getData("text/plain")||"").split(":"); if(k!==col.dataset.drop) return;
  if(k==="cs"){ const c=csGet(id); if(!c||c.coluna===col.dataset.col) return; snap(); c.coluna=col.dataset.col; c.movidoEm=Date.now(); logA("moveu o caso “"+c.titulo+"” para "+csColNome(c)); save(); render(); }
  if(k==="tf"){ const t=tfAll().find(x=>x.id===id); if(!t) return; tfN(t); if(t.status===col.dataset.col) return; snap(); t.status=col.dataset.col; t.done=t.status==="concluida"; if(t.done){ t.doneEm=Date.now(); t.doneBy=ui.me||"?"; } logA("moveu a tarefa “"+t.txt+"” para "+TF_ST[t.status]); save(); render(); } });

document.addEventListener("input", e=>{ const t=e.target; if(!t) return; const map={psBusca:["ps","busca"], csBusca:["cs","busca"], tfBusca:["tf","busca"]}; const m=map[t.id]; if(!m) return; ui[m[0]][m[1]]=t.value; const pos=t.selectionStart; render(); const n=$("#"+t.id); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(x){} } });
document.addEventListener("change", e=>{ const t=e.target; if(!t) return;

function pzAno(dd, mm, aa){ const h=new Date(); let y = aa ? (String(aa).length===2 ? 2000+(+aa) : +aa) : h.getFullYear(); if(!aa){ const cand=new Date(y, mm-1, dd); if(cand - h > 200*864e5) y--; if(h - cand > 200*864e5) y++; } return isoDia(new Date(y, mm-1, dd)); }
function pzParse(txt){
  const out=[]; let pub=isoDia();
  txt.split(/\n/).forEach(l0=>{ const l=l0.replace(/\*/g,"").trim(); if(!l) return;
    const dh=l.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\s*:?$/); if(dh){ pub=pzAno(+dh[1], +dh[2], dh[3]); return; }
    const m=l.match(/^(?:([^:(]{0,40}?):\s*)?(\d{7}-\d{2}(?:\.\d{4}\.\d\.\d{2}\.\d{4})?)\s*(?:\(([^)]*)\))?\s*[-–:]?\s*(.*)$/);
    if(!m){ if(out.length) out[out.length-1].texto += " "+l; return; }
    const pref=(m[1]||"").trim(), proc=m[2], partes=(m[3]||"").trim(); let texto=(m[4]||"").trim();
    const it={processo:proc, partes, pub, texto, tipo:"acao", data:"", hora:"", nDias:0, opcional:false};
    const T=(pref+" "+texto).toLowerCase();
    const pr=texto.match(/prazo de (\d{1,3}) \(?[a-zç\s]*\)?\s*dias?/i) || texto.match(/(\d{1,3}) dias? para/i);
    const au=texto.match(/(per[ií]cia|audi[êe]ncia|sess[ãa]o)[^.]*?(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:[^.]*?(\d{1,2})h(\d{2})?)?/i);
    if(/sem a[çc][õo]es|sem informa/.test(T)){ it.tipo="sem_acao"; if(!texto && pref) texto=pref; }
    else if(au){ it.tipo="audiencia"; it.data=pzAno(+au[2], +au[3], au[4]); it.hora=au[5]?(au[5].padStart(2,"0")+":"+(au[6]||"00")):""; }
    else if(pr){ it.tipo="prazo"; it.nDias=+pr[1]; it.data=diasUteisMais(pub, it.nDias); it.opcional=/opcional/i.test(texto); }
    else if(/apenas acompanhar|só acompanhar|acompanhar/.test(T) && !/aguardar/.test(T)) it.tipo="acompanhar";
    else if(/aguardar|aguardando/.test(T)) it.tipo="aguardar";
    it.texto = texto || pref; out.push(it);
  });
  return out;
}

async function aposLogin(){
  const {data:{user}} = await SB.auth.getUser();
  if(!user){ telaLogin(); return; }
  const {data:p, error} = await SB.from("perfis").select("*").eq("id", user.id).maybeSingle();
  if(error){ telaLogin("Não consegui ler seu perfil agora. Tente de novo em instantes."); return; }
  if(!p || !["master","socio","equipe"].includes(p.papel)){ ui.papel=p?p.papel:"pendente"; telaPendente(user.email, p?p.papel:"pendente"); return; }
  ui.perfil=p; ui.papel=p.papel; if(ui.view==="hoje" && (p.papel==="master"||p.papel==="socio")) ui.view="central";
  ui.me = (p.nome||"").trim() || user.email.split("@")[0];
  try{ localStorage.setItem(KEY_ME, ui.me); }catch(e){}
  authClose(); render(); if(ui.drawer) renderDrawer();
  await iniciarDados();
}

function resolve(k){
  const p=k.split(":");
  const find1=(arr,id)=>arr.find(x=>x.id===id);
  switch(p[0]){
    case "flow": { const f=flowById(p[1]); return f?[f,p[2]]:null; }
    case "step": { const fs=findStep(p[1]); return fs?[fs.s,p[2],fs.s]:null; }
    case "item": { const fs=findStep(p[1]); const c=fs&&find1(fs.s.coleta,p[2]); return c?[c,p[3],fs.s]:null; }
    case "ramo": { const fs=findStep(p[1]); const r=fs&&find1(fs.s.ramos,p[2]); return r?[r,p[3],fs.s]:null; }
    case "msg": { const m=find1(S.biblioteca.mensagens,p[1]); return m?[m,p[2]]:null; }
    case "lista": { const l=find1(S.biblioteca.listas,p[1]); return l?[l,p[2]]:null; }
    case "litem": { const l=find1(S.biblioteca.listas,p[1]); const i=l&&find1(l.itens,p[2]); return i?[i,p[3]]:null; }
    case "mis": { const m=find1(S.trilha.missoes,p[1]); return m?[m,p[2]]:null; }
    case "cen": { const m=find1(S.trilha.cenarios,p[1]); return m?[m,p[2]]:null; }
    case "comp": { const m=find1(S.trilha.comp,p[1]); return m?[m,p[2]]:null; }
    case "ideia": { const m=getIdeia(p[1]); return m?[m,p[2]]:null; }
    case "at": { const m=getAt(p[1]); return m?[m,p[2]]:null; }
  }
  return null;
}
const CAMPO = {titulo:"o título", responsavel:"quem faz", ferramenta:"onde", prazo:"o prazo", descricao:"como fazer", mensagem:"a mensagem", entregavel:"a entrega", planoB:"o plano B", duvida:"a dúvida", slaHoras:"o aviso de atraso", nome:"o nome", canal:"o canal", notas:"as observações"};
let editStart=null;
document.addEventListener("focusin", e=>{ const k=e.target.dataset&&e.target.dataset.k; if(k){ pendingSnap=true; editStart={k, v:e.target.value}; } });
document.addEventListener("focusout", e=>{
  const k=e.target.dataset&&e.target.dataset.k; if(!k||!editStart||editStart.k!==k) return; const changed=editStart.v!==e.target.value; editStart=null; if(!changed) return;
  const p=k.split(":");
  if(p[0]==="step" && CAMPO[p[2]]) logA("alterou "+CAMPO[p[2]]+" "+noPasso(p[1]));
  else if(p[0]==="item"||p[0]==="ramo") logA("alterou "+(p[0]==="item"?"o que pegar":"uma resposta")+" "+noPasso(p[1]));
  else if(p[0]==="flow" && CAMPO[p[2]]) logA("alterou "+CAMPO[p[2]]+" do fluxo", p[1]);
  save();
});
document.addEventListener("input", e=>{
  const t=e.target;
  if(t.id==="palIn"){ palFilter(t.value); return; }
  const k=t.dataset&&t.dataset.k; if(!k) return;
  const r=resolve(k); if(!r) return;
  if(pendingSnap){ snap(); pendingSnap=false; }
  r[0][r[1]] = t.value;
  if(r[2]) stepAfterChange(r[2]);
  if(t.closest(".pick")) t.parentElement.querySelectorAll("button").forEach(b=>b.classList.remove("on"));
  saveSoon();
  if(t.closest("#drawer") && ["step","item","ramo","at","ideia"].includes(k.split(":")[0])){ render(); refreshGuide(); }
  if(k.startsWith("flow:") && k.endsWith(":nome")){ t.size=Math.max(8,t.value.length); }
});
document.addEventListener("change", e=>{
  const t=e.target; const c=t.dataset&&t.dataset.chg; if(!c) return;
  const fs = t.dataset.id ? findStep(t.dataset.id) : null;
  switch(c){
    case "destino": { const r=fs.s.ramos.find(x=>x.id===t.dataset.r); snap(); r.destino=t.value; stepAfterChange(fs.s); logA("mudou uma resposta "+noPasso(fs.s.id), fs.f.id); save(); render(); refreshGuide(); toast("“"+(r.rotulo||"Resposta")+"” agora leva a: "+destLabel(fs.f,r.destino)); break; }
    case "automatizar": snap(); fs.s.automatizar=t.checked; save(); render(); break;
    case "useMsg": { const m=S.biblioteca.mensagens.find(x=>x.id===t.value); if(m){ snap(); fs.s.mensagem = fs.s.mensagem.trim()? fs.s.mensagem+"\n\n"+m.texto : m.texto; save(); ui.drawer.field="mensagem"; renderDrawer(); } break; }
    case "useLista": { const l=S.biblioteca.listas.find(x=>x.id===t.value); if(l){ snap(); const have=new Set(fs.s.coleta.map(x=>x.texto.trim().toLowerCase())); l.itens.filter(i=>i.texto.trim()&&!have.has(i.texto.trim().toLowerCase())).forEach(i=>fs.s.coleta.push({id:uid(),texto:i.texto})); save(); render(); ui.drawer.field="coleta"; renderDrawer(); toast("Lista de “"+l.area+"” adicionada."); } break; }
    case "fbFeito": { snap(); ret(t.dataset.f).feito=t.checked; const x=FB().find(y=>y.id===t.dataset.f); logA((t.checked?"resolveu ":"reabriu ")+"a pendência “"+(x?x.titulo:"")+"”"); save(); render(); renderDrawer(); if(ui.guide && t.checked && t.dataset.f===ui.guide) guideNext(false); break; }
    case "showEnc": ui.showEnc=t.checked; render(); break;
    case "per": ui.per=+t.value; render(); break;
    case "atMover": { const a=getAt(t.dataset.id); if(t.value){ snap(); moveAt(a,t.value,"movido manualmente"); save(); render(); renderDrawer(); } break; }
    case "atCheck": { const a=getAt(t.dataset.id); snap(); a.checks[a.step]=a.checks[a.step]||{}; a.checks[a.step][t.dataset.item]=t.checked; save(); break; }
    case "ideiaCat": { const i=getIdeia(t.dataset.id); snap(); i.cat=t.value; save(); render(); break; }
    case "ideiaSt": { const i=getIdeia(t.dataset.id); snap(); i.status=t.value; logA("mudou a ideia “"+i.titulo+"” para "+t.options[t.selectedIndex].text); save(); render(); renderDrawer(); break; }
    case "ideiaStep": { const i=getIdeia(t.dataset.id); snap(); i.step=t.value; const f2=t.value?findStep(t.value).f:null; i.flow=f2?f2.id:""; save(); render(); renderDrawer(); break; }
    case "misFeito": { const m=S.trilha.missoes.find(x=>x.id===t.dataset.id); snap(); m.feito=t.checked; logA((m.feito?"concluiu":"reabriu")+" a missão “"+m.titulo+"”"); commit(); if(m.feito) toast("Missão concluída!"); break; }
    case "compNivel": { const k=S.trilha.comp.find(x=>x.id===t.dataset.id); snap(); k.nivel=+t.value; k.por=ui.me; k.em=hoje(); commit(); break; }
  }
});
document.addEventListener("click", e=>{
  const t=e.target;
  const pi=t.closest("[data-pi]"); if(pi){ const x=palItems[+pi.dataset.pi]; closePal(); x.go(); return; }
  if(t.closest(".pal")) return;
  const me=t.closest("[data-me]"); if(me){ setMe(me.dataset.me); return; }
  const cp=t.closest("[data-copia]"); if(cp){ closeModal(); restaurarCopia(cp.dataset.copia); return; }
  const ocm=t.closest("[data-ocm]"); if(ocm){ ocm.parentElement.querySelectorAll("button").forEach(b=>b.classList.remove("on")); ocm.classList.add("on"); return; }
  const mact=t.closest("[data-mact]"); if(mact){ e.preventDefault(); const fn=MACT[mact.dataset.mact]; if(fn) fn(mact); return; }
  if(t.closest("[data-mb]")) return;
  const g=t.closest("[data-go]"); if(g){ go(g.dataset.go); return; }
  const gt=t.closest("[data-gtab]"); if(gt){ ui.gtab=gt.dataset.gtab; if(ui.view!=="gestao") go("gestao"); else render(); window.scrollTo(0,0); return; }
  const pk=t.closest("[data-pick]"); if(pk && ui.drawer && ui.drawer.type==="step"){ const s=findStep(ui.drawer.id).s; snap(); s[pk.dataset.pick]=pk.dataset.v; stepAfterChange(s); logA("definiu "+CAMPO[pk.dataset.pick]+" "+noPasso(s.id)+": "+pk.dataset.v); save(); render(); renderDrawer(); refreshGuide(); return; }
  const fl=t.closest("[data-flow]"); if(fl && !t.closest("[data-act]")){ S.ativo=fl.dataset.flow; persist(); render(); return; }
  const fm=t.closest("[data-fmode]"); if(fm){ ui.fmode=fm.dataset.fmode; ui.dsel=null; ui.pendingFrom=null; render(); return; }
  const ifl=t.closest("[data-ifilter]"); if(ifl){ ui.ideaFilter=ifl.dataset.ifilter; render(); return; }
  const ad=t.closest("[data-add]"); if(ad){ const f=flow(); addStepAt(f, +ad.dataset.add, ad.dataset.t||null); return; }
  const a=t.closest("[data-act]"); if(a && !a.disabled){ e.preventDefault(); const fn=ACT[a.dataset.act]; if(fn) fn(a); }
});
document.addEventListener("keydown", e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); openPalette(); return; }
  if($("#pal").innerHTML){
    if(e.key==="Escape") return closePal();
    if(e.key==="ArrowDown"){ e.preventDefault(); palSel=Math.min(palItems.length-1,palSel+1); drawPal(); }
    if(e.key==="ArrowUp"){ e.preventDefault(); palSel=Math.max(0,palSel-1); drawPal(); }
    if(e.key==="Enter" && palItems[palSel]){ e.preventDefault(); const x=palItems[palSel]; closePal(); x.go(); }
    return;
  }
  if(e.key==="Escape"){ if($("#modalRoot").innerHTML) return closeModal(); if(ui.drawer) return closeDrawer(); if(ui.guide) return guideStop(); }
  if(e.key==="Enter" && e.target.dataset && e.target.dataset.enter){ e.preventDefault(); const fn=ACT[e.target.dataset.enter]; if(fn) fn(e.target); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z" && !e.shiftKey && !typing){ e.preventDefault(); undo(); return; }
  if((e.key==="Enter"||e.key===" ") && !typing && e.target.matches && e.target.matches("[role=button]")){ e.preventDefault(); e.target.click(); }
  if(ui.view==="fluxos" && ui.fmode==="desenho" && ui.dsel && !typing && !$("#modalRoot").innerHTML && (e.key==="Delete"||e.key==="Backspace")){
    e.preventDefault(); const d=DD(); snap();
    if(ui.dsel.t==="n"){ d.nodes=d.nodes.filter(k=>k.id!==ui.dsel.id); d.edges=d.edges.filter(k=>k.de!==ui.dsel.id&&k.para!==ui.dsel.id); }
    if(ui.dsel.t==="e") d.edges=d.edges.filter(k=>k.id!==ui.dsel.id);
    if(ui.dsel.t==="t") d.tracos=d.tracos.filter(k=>k.id!==ui.dsel.id);
    ui.dsel=null; save(); redraw();
  }
});

/* ================= ARRASTAR (passos, clientes, ideias) ================= */
let dragKind=null, dragId=null;
document.addEventListener("dragstart", e=>{
  const s=e.target.closest&&e.target.closest("[data-drag],[data-adrag],[data-idrag]"); if(!s) return;
  dragKind = s.dataset.drag?"step":s.dataset.adrag?"at":"ideia"; dragId = s.dataset.drag||s.dataset.adrag||s.dataset.idrag;
  e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain", dragId); s.classList.add("dragging");
});
document.addEventListener("dragend", ()=>{ $$(".dragging").forEach(x=>x.classList.remove("dragging")); $$(".dropbefore,.over").forEach(x=>x.classList.remove("dropbefore","over")); dragKind=null; });
document.addEventListener("dragover", e=>{
  if(!dragKind) return;
  const tgt = dragKind==="step" ? e.target.closest(".srow,.addlast") : dragKind==="at" ? e.target.closest(".kcol") : e.target.closest(".icol");
  if(!tgt) return; e.preventDefault();
  $$(".dropbefore,.over").forEach(x=>{ if(x!==tgt) x.classList.remove("dropbefore","over"); });
  tgt.classList.add(dragKind==="step"&&tgt.classList.contains("srow")?"dropbefore":"over");
});
document.addEventListener("drop", e=>{
  if(!dragKind) return;
  if(dragKind==="step"){
    const tgt=e.target.closest(".srow,.addlast"); if(!tgt) return; e.preventDefault(); const f=flow(); const from=idx(f,dragId); if(from<0) return;
    snap(); const [m]=f.steps.splice(from,1);
    if(tgt.classList.contains("addlast")) f.steps.push(m); else { const to=idx(f,tgt.dataset.drag); f.steps.splice(to<0?f.steps.length:to,0,m); }
    logA("mudou a ordem: "+stepRef(m.id), f.id); save(); render(); toast("“"+(m.titulo||"Passo")+"” agora é o passo "+(idx(f,m.id)+1)+".", ()=>undo());
  } else if(dragKind==="at"){
    const col=e.target.closest(".kcol"); if(!col) return; e.preventDefault(); const a=getAt(dragId); if(a && a.step!==col.dataset.col){ snap(); moveAt(a, col.dataset.col, "arrastado no quadro"); save(); render(); toast(a.nome+" foi para “"+(findStep(col.dataset.col).s.titulo||"")+"”."); }
  } else {
    const col=e.target.closest(".icol"); if(!col) return; e.preventDefault(); const i=getIdeia(dragId); if(i && i.status!==col.dataset.icol){ snap(); i.status=col.dataset.icol; logA("moveu a ideia “"+i.titulo+"” para "+IDEIA_ST.find(s=>s[0]===i.status)[1]); save(); render(); }
  }
  dragKind=null;
});
function bindStepDrag(){}

/* ================= ARQUIVOS (restaurar, modelo) ================= */
$("#fileIn").addEventListener("change", e=>{
  const file=e.target.files&&e.target.files[0]; if(!file) return; const mode=e.target.dataset.mode;
  const rd=new FileReader(); rd.onload=()=>{
    let j=null; try{ j=JSON.parse(rd.result); }catch(err){}
    if(mode==="modelo"){
      if(!j||j.tipo!=="modelo-de-fluxo"||!j.fluxo){ modal("Não é um modelo", `<p>Escolha um arquivo criado por “Exportar como modelo”.</p>`, [{label:"Ok", cls:"primary"}]); return; }
      snap(); const f=newFlow(j.fluxo.nome+" (modelo)", j.fluxo.canal); f.descricao=j.fluxo.descricao||""; const map={};
      f.steps=(j.fluxo.steps||[]).map(s=>{ const n=Object.assign(newStep(s.tipo), s); map[s.id]=n.id=uid(); n.coleta=(n.coleta||[]).map(c=>({id:uid(), texto:c.texto})); return n; });
      f.steps.forEach(s=>{ s.ramos=(s.ramos||[]).map(r=>({id:uid(), rotulo:r.rotulo, destino:map[r.destino]||(r.destino==="__fim"?"__fim":"")})); });
      S.flows.push(f); S.ativo=f.id; S=normalize(S); logA("importou o modelo “"+j.fluxo.nome+"”", f.id); ui.view="fluxos"; ui.fmode="lista"; commit(); toast("Modelo importado como fluxo novo.");
    } else {
      const d=normalize(j); if(!d){ modal("Não consegui abrir", `<p>Esse arquivo não é uma cópia do Mapa de Atendimento.</p>`, [{label:"Ok", cls:"primary"}]); return; }
      modal("Restaurar esta cópia?", `<p>Cópia de ${esc(fmtT(d.atualizadoEm))}, com ${d.flows.length} fluxo(s). Ela substitui os dados atuais${HAS_GS?" para todos":""}. Dá para desfazer logo depois.</p>`, [{label:"Cancelar"},{label:"Restaurar", cls:"primary", fn:()=>{ snap(); S=d; logA("restaurou uma cópia de arquivo"); persist(); render(); if(HAS_GS) pushNow(true); toast("Cópia restaurada."); }}]);
    }
  }; rd.readAsText(file);
});
window.addEventListener("beforeunload", ()=>{ clearTimeout(saveT); persist(); });

/* ================= INÍCIO ================= */
render();
updUndo();
if(persist()) setSave("Salvo neste computador", "");
if(!HAS_GS){ const bt=$("#boot"); if(bt) bt.remove(); }
authInit();
window.addEventListener("beforeunload", e=>{ if(HAS_GS && (srv.state==="pending"||srv.state==="saving"||srv.state==="offline")){ pushNow(false); e.preventDefault(); e.returnValue=""; } });
})();
