<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa de Atendimento M&amp;P</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: trilho de navegação · barra de busca e status · conteúdo · painel lateral deslizante */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --surface-2:#eef2f1; --surface-3:#e4eae8; --line:#dbe2e0; --fg:#16232a; --muted:#5d6c72;
  --accent:#0d5c63; --accent-fg:#fff; --accent-soft:#ddeced; --accent-2:#0a4a50;
  --warn:#8f5400; --warn-soft:#fcefd8; --danger:#b3261e; --danger-soft:#fbe5e3; --ok:#2a7a4b; --ok-soft:#dff1e6; --idea:#7a4fb0; --idea-soft:#efe7fa;
  --t-inicio:#2f7d4f; --t-acao:#3b5b8c; --t-mensagem:#0d7c86; --t-decisao:#b06a00; --t-coleta:#6b4fa0; --t-encaminhar:#3a4fb5; --t-espera:#6b7378; --t-fim:#a8324f; --t-reuniao:#1f6f8b; --t-cobranca:#8a6400; --t-documento:#6a5240; --t-registro:#2c6e5a; --t-followup:#8a3f8f;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --shadow:0 1px 2px rgba(16,35,42,.06),0 4px 14px rgba(16,35,42,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10171a; --surface:#182226; --surface-2:#1e2a2f; --surface-3:#25333a; --line:#2c3a40; --fg:#e7eef0; --muted:#9aabb1;
  --accent:#5fb7bd; --accent-fg:#0b1a1c; --accent-soft:#1c393c; --accent-2:#86cdd2;
  --warn:#f0b45a; --warn-soft:#382a14; --danger:#ff8a80; --danger-soft:#3b1e1c; --ok:#6cc68f; --ok-soft:#163625; --idea:#c3a6f0; --idea-soft:#2c2340;
  --t-inicio:#6cc68f; --t-acao:#8fb0e6; --t-mensagem:#5fc6cf; --t-decisao:#f0b45a; --t-coleta:#b9a2ea; --t-encaminhar:#9aa8f5; --t-espera:#a8b2b7; --t-fim:#f08aa3; --t-reuniao:#6cc0de; --t-cobranca:#e0c060; --t-documento:#c8ae98; --t-registro:#78c9ad; --t-followup:#d99ade;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10171a; --surface:#182226; --surface-2:#1e2a2f; --surface-3:#25333a; --line:#2c3a40; --fg:#e7eef0; --muted:#9aabb1;
  --accent:#5fb7bd; --accent-fg:#0b1a1c; --accent-soft:#1c393c; --accent-2:#86cdd2;
  --warn:#f0b45a; --warn-soft:#382a14; --danger:#ff8a80; --danger-soft:#3b1e1c; --ok:#6cc68f; --ok-soft:#163625; --idea:#c3a6f0; --idea-soft:#2c2340;
  --t-inicio:#6cc68f; --t-acao:#8fb0e6; --t-mensagem:#5fc6cf; --t-decisao:#f0b45a; --t-coleta:#b9a2ea; --t-encaminhar:#9aa8f5; --t-espera:#a8b2b7; --t-fim:#f08aa3; --t-reuniao:#6cc0de; --t-cobranca:#e0c060; --t-documento:#c8ae98; --t-registro:#78c9ad; --t-followup:#d99ade;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--muted)}
.pre{white-space:pre-wrap}
.t-inicio{--tc:var(--t-inicio)}.t-acao{--tc:var(--t-acao)}.t-mensagem{--tc:var(--t-mensagem)}.t-decisao{--tc:var(--t-decisao)}.t-coleta{--tc:var(--t-coleta)}.t-encaminhar{--tc:var(--t-encaminhar)}.t-espera{--tc:var(--t-espera)}.t-fim{--tc:var(--t-fim)}.t-reuniao{--tc:var(--t-reuniao)}.t-cobranca{--tc:var(--t-cobranca)}.t-documento{--tc:var(--t-documento)}.t-registro{--tc:var(--t-registro)}.t-followup{--tc:var(--t-followup)}

/* casca */
.app{display:grid;grid-template-columns:84px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px;position:sticky;top:0;height:100vh;z-index:33}
.logo{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:16px;margin-bottom:12px}
.nav{width:72px;border:0;background:transparent;border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11.5px;font-weight:700;position:relative}
.nav svg{width:22px;height:22px}
.nav:hover{background:var(--surface-2);color:var(--fg)}
.nav.on{background:var(--accent-soft);color:var(--accent)}
.nav .dot{position:absolute;top:3px;right:11px;min-width:17px;height:17px;border-radius:99px;background:var(--danger);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 24px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.search{flex:1 1 260px;max-width:460px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 12px;color:var(--muted);font-size:14px;text-align:left}
.search kbd,.kbd{margin-left:auto;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--surface)}
.tsp{margin-left:auto}
.savechip{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);border:1px solid transparent;background:transparent;border-radius:99px;padding:5px 10px;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.savechip:hover{background:var(--surface-2)}
.savechip i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.savechip.saving i{background:var(--warn)}
#boot{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;font-size:16px;color:var(--muted)}
#boot div{display:flex;flex-direction:column;align-items:center;gap:12px}
#boot i{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.savechip.err i,.savechip.need i{background:var(--danger)}
.savechip.need,.savechip.err{color:var(--danger);background:var(--danger-soft)}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 10px 3px 3px;font-weight:600;font-size:14px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;background:var(--accent);flex:none}
.av.g{background:#3b5b8c}.av.a{background:#8a3f8f}.av.x{background:#6b7378}
.content{padding:24px clamp(16px,3vw,36px) 90px;max-width:1240px;width:100%}

/* botões */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;line-height:1.3}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.idea{background:var(--idea);border-color:var(--idea);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.big{padding:12px 18px;font-size:15.5px;border-radius:11px}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn svg,.ic16{width:16px;height:16px;flex:none}
.iconbtn{border:0;background:transparent;border-radius:8px;width:32px;height:32px;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--surface-2);color:var(--fg)}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn svg{width:17px;height:17px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}

/* páginas */
.phead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:20px}
.phead h1{font-size:30px}
.phead p{margin-top:4px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3{font-size:16px}
.card .sub{margin-top:-6px;color:var(--muted);font-size:13.5px}
.card.hero{border:1.5px solid color-mix(in srgb,var(--warn) 45%,var(--line))}
.count{font-family:var(--f-body);font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px;background:var(--surface-2);color:var(--muted)}
.count.r{background:var(--danger-soft);color:var(--danger)}
.count.w{background:var(--warn-soft);color:var(--warn)}
.count.i{background:var(--idea-soft);color:var(--idea)}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.task:hover{border-color:var(--accent)}
.task .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.task .ic svg{width:18px;height:18px}
.task.late .ic{background:var(--danger-soft);color:var(--danger)}
.task.soon .ic{background:var(--warn-soft);color:var(--warn)}
.task b{display:block;font-size:15px}
.task small{color:var(--muted);font-size:13px}
.task .when{font-size:12.5px;font-weight:700;color:var(--danger);white-space:nowrap}
.task .when.ok{color:var(--muted);font-weight:500}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:16px;border:1.5px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;gap:8px;align-items:center}
.ring{--p:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring span{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:14px}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{display:flex;gap:8px;align-items:baseline;font-size:14px}
.plist li.done{color:var(--muted);text-decoration:line-through}
.bul{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none;transform:translateY(-1px)}
.done .bul{background:var(--ok)}
.prog{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick .btn{justify-content:flex-start}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.kpi span{font-size:12.5px;color:var(--muted);display:block}
.kpi b{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.kpi.g b{color:var(--ok)}.kpi.r b{color:var(--danger)}
.banner{background:var(--accent-soft);border-radius:12px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:18px;font-size:14.5px}

/* chips de fluxo e segmentos */
.fhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center}
.fchip:hover{border-color:var(--accent)}
.fchip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.fchip .count{background:var(--danger-soft);color:var(--danger)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:7px;padding:6px 12px;font-weight:600;font-size:13.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.seg svg{width:15px;height:15px}
.ftitle{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:6px}
.ftitle input{font-family:var(--f-display);font-size:28px;font-weight:700;border:1px solid transparent;border-radius:8px;padding:0 6px;margin-left:-7px;background:transparent;min-width:0;flex:0 1 auto;width:auto;max-width:100%}
.ftitle input:hover{border-color:var(--line)}
.ftitle input:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.fsub{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:16px;font-size:13.5px;color:var(--muted)}
.fsub input{border:1px solid transparent;border-radius:7px;padding:2px 6px;background:transparent;color:var(--muted);min-width:0}
.fsub input:hover{border-color:var(--line)}
.fsub input:focus{border-color:var(--accent);outline:none;color:var(--fg);background:var(--surface)}
.vpill{font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.vpill.ok{background:var(--ok-soft);color:var(--ok)}

/* lista de passos */
.slist{display:flex;flex-direction:column;max-width:860px}
.srow{display:grid;grid-template-columns:22px 36px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;position:relative;transition:border-color .15s,box-shadow .15s}
.srow:hover{border-color:var(--tc)}
.srow.sel{border-color:var(--tc);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 22%,transparent)}
.srow.dragging{opacity:.4}
.srow.dropbefore{box-shadow:0 -3px 0 0 var(--accent)}
.grip{color:var(--line);cursor:grab;display:grid;place-items:center}
.srow:hover .grip{color:var(--muted)}
.grip svg{width:16px;height:16px}
.sn{width:36px;height:36px;border-radius:10px;background:color-mix(in srgb,var(--tc) 14%,var(--surface));color:var(--tc);display:grid;place-items:center;font-weight:700;font-size:15px;border:1.5px solid color-mix(in srgb,var(--tc) 45%,transparent)}
.srow.t-decisao .sn{border-radius:50%}
.sbody{min-width:0}
.sbody b{display:block;font-size:15.5px;overflow-wrap:anywhere}
.sbody b.empty{color:var(--muted);font-weight:500;font-style:italic}
.skind{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tc)}
.smeta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:2px}
.smeta span{display:inline-flex;gap:5px;align-items:center}
.smeta svg{width:13px;height:13px}
.resps{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.resp{font-size:12.5px;border-radius:7px;padding:2px 8px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.sbadges{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.bdg{font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap}
.bdg.pend{background:var(--danger-soft);color:var(--danger)}
.bdg.val{background:var(--ok-soft);color:var(--ok)}
.bdg.rev{background:var(--warn-soft);color:var(--warn)}
.bdg.prop{background:var(--surface-2);color:var(--muted)}
.bdg.oc{background:var(--warn-soft);color:var(--warn)}
.bdg.auto{background:var(--accent-soft);color:var(--accent)}
.bdg.ideia{background:var(--idea-soft);color:var(--idea)}
.bdg.dica{background:var(--accent-soft);color:var(--accent)}
.gap{height:22px;position:relative;display:flex;justify-content:center;align-items:center;max-width:860px}
.gap::before{content:"";position:absolute;left:43px;top:0;bottom:0;border-left:2px solid var(--line)}
.addbtn{opacity:0;border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:99px;font-size:12px;font-weight:700;padding:1px 10px;transition:opacity .15s;position:relative}
.gap:hover .addbtn,.addbtn:focus-visible{opacity:1}
.addlast{max-width:860px;margin-top:12px;border:1.5px dashed var(--line);background:transparent;border-radius:12px;padding:14px;font-weight:700;color:var(--accent);width:100%}
.addlast:hover{border-color:var(--accent);background:var(--accent-soft)}
.notesbox{max-width:860px;margin-top:22px}

/* mapa */
.mapwrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:calc(100vh - 240px)}
.mapwrap svg{display:block}
.mnode{cursor:pointer}
.mnode:hover rect,.mnode:hover path{stroke-width:3}
.hint{font-size:13.5px;color:var(--muted);margin:0 0 10px}

/* desenho */
.dtools{display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;margin-bottom:8px}
.dtools .sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.tool{border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 10px;font-size:13.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center;color:var(--fg)}
.tool:hover{background:var(--surface-2)}
.tool.on{background:var(--accent);color:var(--accent-fg)}
.tool svg{width:16px;height:16px}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0}
.sw.on{box-shadow:0 0 0 2px var(--accent)}
.board{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fbfcfb;height:calc(100vh - 260px);min-height:420px;touch-action:none}
.board svg{display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.board[data-tool="sel"] svg{cursor:default}.board[data-tool="pen"] svg{cursor:crosshair}.board[data-tool="erase"] svg{cursor:not-allowed}
.board[data-tool="box"] svg,.board[data-tool="dec"] svg,.board[data-tool="oval"] svg,.board[data-tool="txt"] svg,.board[data-tool="seta"] svg,.board[data-tool="nota"] svg{cursor:copy}
.drawprev{border:1px solid var(--line);border-radius:8px;background:#fff;overflow:auto;margin:10px 0}
.drawprev svg{display:block;max-width:100%;height:auto}

/* painel lateral */
.scrim{position:fixed;inset:0;background:rgba(10,20,24,.2);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.12);z-index:31;transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer.wide{width:min(620px,100%)}
.dh{padding:14px 18px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.dh .kind{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--tc,var(--muted))}
.titlein{font-family:var(--f-display);font-size:22px;font-weight:700;border:1px solid transparent;border-radius:8px;padding:2px 6px;margin-left:-7px;background:transparent;width:100%}
.titlein:hover{border-color:var(--line)}
.titlein:focus{border-color:var(--accent);outline:none;background:var(--surface-2)}
.db{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.df{display:flex;flex-direction:column;gap:6px}
.df>label,.df>.lab{font-size:13px;font-weight:700}
.df>label em,.df>.lab em{font-style:normal;font-weight:500;color:var(--muted)}
.df input,.df select,.df textarea,.inp{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--surface)}
.df textarea{min-height:80px;resize:vertical;field-sizing:content}
.df input:focus,.df select:focus,.df textarea:focus,.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.df.q textarea{background:var(--warn-soft)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13.5px;font-weight:600}
.pick button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.pick input{flex:1 1 120px;min-width:0;border:1px dashed var(--line);border-radius:99px;padding:5px 12px;font-size:13.5px;width:auto}
.more{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.more>summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;background:var(--surface-2)}
.more>summary::-webkit-details-marker{display:none}
.more>summary .chev{margin-left:auto;transition:transform .15s}
.more[open]>summary .chev{transform:rotate(180deg)}
.more .in{padding:14px;display:flex;flex-direction:column;gap:14px}
.resprow{display:grid;grid-template-columns:minmax(0,.8fr) auto minmax(0,1.4fr) auto;gap:6px;align-items:center}
.resprow input,.resprow select{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--surface);min-width:0;width:100%}
.colrow{display:flex;gap:6px;align-items:center}
.colrow input{flex:1}
.typegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.typebtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 9px;font-size:13px;font-weight:600;text-align:left;display:flex;gap:8px;align-items:center}
.typebtn i{width:10px;height:10px;border-radius:3px;background:var(--tc);flex:none}
.typebtn.on{border-color:var(--tc);box-shadow:0 0 0 2px color-mix(in srgb,var(--tc) 30%,transparent)}
.note{border-radius:10px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.note.pend{background:var(--danger-soft)}
.note.pend>b{color:var(--danger)}
.note.ok{background:var(--ok-soft)}
.note.dica{background:var(--accent-soft)}
.note.dica>b{color:var(--accent)}
.note.idea{background:var(--idea-soft)}
.hl,.hlbox{animation:hl 1.2s ease 3;border-color:var(--warn)!important}
@keyframes hl{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--warn) 45%,transparent);background-color:var(--warn-soft)}}
.dfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vars{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.vars small{color:var(--muted);font-size:12px;margin-right:2px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:1px 8px;font-size:12px;font-family:ui-monospace,Consolas,monospace;color:var(--accent)}
.chipbtn:hover{border-color:var(--accent)}
.mini{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface);font-size:13px;max-width:100%}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--accent);flex:none}
.thread{display:flex;flex-direction:column;gap:6px}
.msgc{background:var(--surface-2);border-radius:10px;padding:7px 10px;font-size:13.5px;max-width:92%}
.msgc.me{background:var(--accent-soft);align-self:flex-end}
.msgc span{color:var(--muted);font-size:11.5px}
.msgc p{margin-top:2px}

/* clientes (kanban) */
.kb{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.kcol{flex:0 0 240px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:200px}
.kcol.over{outline:2px dashed var(--accent);outline-offset:-2px}
.kcol header{display:flex;gap:6px;align-items:center;font-size:13.5px;padding:2px 2px 4px}
.kcol header b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcol header .sn{width:24px;height:24px;font-size:12px;border-radius:7px}
.kc{background:var(--surface);border-radius:99px;padding:0 7px;font-size:12px;font-weight:700}
.kempty{color:var(--muted);text-align:center;margin:10px 0;font-size:13px}
.acard{text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;cursor:grab;width:100%}
.acard:hover{border-color:var(--accent)}
.acard.dragging{opacity:.5}
.acard span{font-size:12px;color:var(--muted)}
.acard em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--danger)}
.acard em.s{color:var(--warn)}
.acard.late{border-left-color:var(--danger);background:var(--danger-soft)}
.acard.soon{border-left-color:var(--warn)}
.acard.okk{border-left-color:var(--ok)}
.nextbig{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:12px;background:var(--surface-2)}
.nextbig .btn.big{justify-content:center}
.stepbox{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;border-left:4px solid var(--tc)}

/* ideias */
.ideaadd{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;margin-bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--shadow)}
.ideaadd input,.ideaadd select{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--surface);min-width:0}
.ideaadd input:focus{border-color:var(--idea);outline:none;box-shadow:0 0 0 3px var(--idea-soft)}
.icols{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.icol{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:220px}
.icol.over{outline:2px dashed var(--idea);outline-offset:-2px}
.icol header{display:flex;gap:6px;align-items:center;font-weight:700;font-size:14px;padding:2px 4px}
.icard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:grab;text-align:left;width:100%;border-top:4px solid var(--cc,var(--idea))}
.icard:hover{border-color:var(--idea)}
.icard b{font-size:14.5px}
.icard p{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.icard .im{display:flex;gap:10px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap}
.catchip{font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px;background:color-mix(in srgb,var(--cc) 15%,var(--surface));color:var(--cc)}
.vote{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700;display:inline-flex;gap:5px;align-items:center}
.vote.on{background:var(--idea);border-color:var(--idea);color:#fff}
.descart{margin-top:10px}

/* gestão */
.gtabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}
.gtabs button{border:0;background:transparent;padding:9px 12px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.gtabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.prows{display:flex;flex-direction:column;gap:5px}
.prow{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.pl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--accent);border-radius:99px}
.prow b{font-variant-numeric:tabular-nums;white-space:nowrap}
.pauta pre{background:var(--surface-2);border-radius:10px;padding:12px;white-space:pre-wrap;font-size:13px;margin:0;max-height:380px;overflow:auto;font-family:ui-monospace,Consolas,monospace}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.cardf{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cardf.done{opacity:.7}
.cardf.certo{border-color:var(--ok)}.cardf.revisar{border-color:var(--danger)}
.secth{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:end;margin:6px 0 12px}
.secth h2{font-size:20px}
.secth p{color:var(--muted);font-size:14px;max-width:64ch;margin-top:2px}
.comp{display:flex;flex-direction:column;gap:6px;max-width:860px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.crow input{border:1px solid transparent;border-radius:6px;padding:4px 6px;background:transparent;min-width:0}
.crow input:focus{border-color:var(--accent);outline:none}
.dots{display:flex;gap:3px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--ok)}
.loglist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.loglist li{display:flex;gap:8px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px;flex-wrap:wrap}
.loglist li>span:first-child{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;flex:none}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px clamp(16px,4vw,40px);max-width:900px}
.doc h2{font-size:22px;margin:24px 0 6px}
.doc h3{font-size:16px;margin:16px 0 6px}
.doc p{margin:4px 0}
.doc blockquote{margin:6px 0 10px;padding:8px 12px;background:var(--surface-2);border-radius:8px;white-space:pre-wrap;font-size:14px}
.poptab{border-collapse:collapse;width:100%;font-size:13px;min-width:720px}
.poptab th,.poptab td{border:1px solid var(--line);padding:6px;vertical-align:top;text-align:left}
.poptab th{background:var(--surface-2);font-size:12px}
.pophead{border-bottom:2px solid var(--accent);padding-bottom:10px;margin-bottom:12px}
.pophead h1{font-size:26px}
.warnbox{background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.autoc{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.lbl{color:var(--muted);font-weight:700}

/* modal, busca, toast, guia */
.modal-bg{position:fixed;inset:0;background:rgba(10,20,24,.4);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:14px;max-width:540px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
.modal.wide{max-width:820px}
.modal h3{font-size:19px}
.modal .mfoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.pal-bg{position:fixed;inset:0;background:rgba(10,20,24,.35);z-index:55;display:flex;justify-content:center;align-items:flex-start;padding:10vh 16px}
.pal{width:min(620px,100%);background:var(--surface);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.3);overflow:hidden}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:16px;background:transparent;outline:none}
.pal ul{list-style:none;margin:0;padding:6px;max-height:52vh;overflow:auto}
.pal li{padding:9px 12px;border-radius:9px;display:flex;gap:10px;align-items:center;cursor:pointer}
.pal li small{color:var(--muted);margin-left:auto;font-size:12px;white-space:nowrap}
.pal li.on{background:var(--accent-soft)}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 14px;font-size:14px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:auto;max-width:min(560px,calc(100vw - 32px))}
.toast button{border:0;background:transparent;color:#7fd0d6;font-weight:700;padding:0}
:root[data-theme="dark"] .toast button{color:var(--accent-fg)}
.guide{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:40;width:min(680px,calc(100% - 32px));background:var(--fg);color:var(--bg);border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.3);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.drawer.on ~ #guide .guide{left:calc((100% - 480px)/2)}
.drawer.on ~ .toasts{left:calc((100% - 480px)/2)}
body.guiding .toasts{bottom:210px}
.guide .gh{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.guide h3{font-size:18px;color:var(--bg)}
.guide p{font-size:14.5px;line-height:1.5;white-space:pre-line}
.guide .btn{border-color:transparent;color:var(--fg)}
.guide .btn.primary{color:var(--accent-fg)}
.guide .btn.ok{color:#fff}
.guide .btn.ghost{color:var(--bg)}
.guide .btn.ghost:hover{background:rgba(255,255,255,.12)}
.gdots{display:flex;gap:5px;margin-left:auto}
.gdots i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.3}
.gdots i.on{opacity:1}

@media (max-width:980px){ .grid2{grid-template-columns:minmax(0,1fr)} .icols{grid-template-columns:repeat(4,240px)} }
@media (max-width:640px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{z-index:22;position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px;border-right:0;border-top:1px solid var(--line)}
  .logo{display:none}
  .nav{width:auto;flex:1}
  .content{padding-bottom:110px}
  .savechip span{display:none}
  .quick{grid-template-columns:1fr}
  .resprow{grid-template-columns:1fr auto}
  .resprow .arr{display:none}
  .ideaadd{grid-template-columns:1fr}
  .crow{grid-template-columns:minmax(0,1fr) auto}
  .crow .dots,.crow small{display:none}
  .top .tsp{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  body{background:#fff;color:#000}
  .rail,.top,.noprint,.drawer,.scrim,.toasts,#guide{display:none!important}
  .app{display:block}
  .content{padding:0;max-width:none}
  .doc{border:0;padding:0;max-width:none}
}

/* ===== Caixinha de pedidos ===== */
.pd-fab{position:fixed;right:20px;bottom:20px;z-index:40;display:flex;align-items:center;gap:8px;border:0;border-radius:99px;padding:11px 16px;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:14px;box-shadow:0 6px 20px rgba(13,92,99,.35)}
.pd-fab:hover{background:var(--accent-2)}

.pd-seg button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pd-list{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.pd-empty{text-align:center;margin:auto;padding:20px;font-weight:600}
.pd-empty .muted{font-weight:400;font-size:13.5px}
.pd-it{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pd-it.done{opacity:.72}
.pd-h{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:13.5px}
.av.sm{width:22px;height:22px;font-size:11px}
.pd-tag{font-size:11.5px;font-weight:700;border-radius:99px;padding:0 8px;color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,transparent)}
.pd-t{font-size:12px;margin-left:auto}
.pd-txt{white-space:pre-wrap;word-break:break-word;font-size:14.5px}
.pd-r{border-left:3px solid var(--accent-soft);padding:2px 0 2px 9px;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.pd-r .pd-t{margin-left:4px}
.pd-ok{color:var(--ok);font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:4px}
.pd-rin{display:flex;gap:6px}
.pd-rin .inp{padding:6px 9px;font-size:13.5px}
.pd-acts{display:flex;gap:12px;flex-wrap:wrap}
.lnk{border:0;background:transparent;padding:0;color:var(--accent);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.lnk:hover{text-decoration:underline}
.lnk.danger{color:var(--danger)}
.pd-comp{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.pd-comp textarea{width:100%;min-height:64px;max-height:180px;resize:none;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surface);font-size:14.5px}
.pd-comp .row2{display:flex;align-items:center;gap:8px}
.pd-comp .row2 small{flex:1;color:var(--muted);font-size:12px;line-height:1.3}
.pd-banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:12px;padding:10px 14px;margin:0 0 16px;font-weight:600}
.pd-banner span{flex:1}
@media (max-width:760px){ .pd-fab{bottom:76px;right:12px} .pd-panel{right:8px;left:8px;width:auto;max-width:none;bottom:70px;height:calc(100vh - 150px)} }

.pd-panel.ia .pd-pdf,.pd-panel.ia .pd-tipos,.pd-panel:not(.ia) .pd-ia-chips{display:none!important}

.pd-ia-chips button:hover{background:var(--accent-soft)}
.as-m{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:5px}
.as-m.u{margin-left:28px;background:var(--accent-soft);border-color:transparent}
.as-m.a{margin-right:20px}

function mapa(f){
  const W=820, X=300, NW=270, NH=58, GAP=50; let y=24; const pos={};
  f.steps.forEach(s=>{ const h=s.tipo==="decisao"?76:NH; pos[s.id]={y,h}; y+=h+GAP; });
  const H=Math.max(200,y+10); let edges="", extra="", lane=0;
  f.steps.forEach((s,i)=>{
    const a=pos[s.id]; const nx=f.steps[i+1];
    const outs = s.tipo==="decisao" ? s.ramos.map(r=>({to:r.destino&&!r.destino.startsWith("flow:")&&r.destino!=="__fim"?r.destino:(r.destino?null:(nx?nx.id:null)), lab:r.rotulo, fim:r.destino==="__fim", fl:r.destino&&r.destino.startsWith("flow:")?r.destino:null})) : (nx && s.tipo!=="fim" ? [{to:nx.id, lab:""}] : []);
    let k=0;
    outs.forEach(o=>{
      if(o.fim || o.fl){ const ex=X+NW/2+140, ey=a.y+a.h/2+(k++)*30-10; const lab=o.fim?"Encerra":"Outro fluxo"; extra += `<path d="M${X+NW/2} ${ey} H${ex-48}" stroke="var(--muted)" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><rect x="${ex-48}" y="${ey-14}" width="104" height="28" rx="14" fill="var(--danger-soft)" stroke="var(--t-fim)"/><text x="${ex+4}" y="${ey+4.5}" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--t-fim)">${lab}</text>${o.lab?`<text x="${X+NW/2+20}" y="${ey-6}" font-size="12" font-weight="700" fill="var(--t-decisao)">${esc(o.lab)}</text>`:""}`; return; }
      const b=pos[o.to]; if(!b) return;
      if(nx && o.to===nx.id){ edges += `<path d="M${X} ${a.y+a.h} V${b.y}" stroke="var(--muted)" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>${o.lab?`<text x="${X+8}" y="${a.y+a.h+GAP/2+4}" font-size="12" font-weight="700" fill="var(--t-decisao)">${esc(o.lab)}</text>`:""}`; }
      else { lane++; const lx=X-NW/2-26-lane*22; const y1=a.y+a.h/2, y2=b.y+b.h/2;
        edges += `<path d="M${X-NW/2} ${y1} H${lx} V${y2} H${X-NW/2-2}" stroke="var(--t-decisao)" stroke-width="1.8" fill="none" marker-end="url(#ard)"/><text x="${lx-6}" y="${(y1+y2)/2}" text-anchor="end" font-size="12" font-weight="700" fill="var(--t-decisao)">${esc(o.lab||"")}</text>`; }
    });
  });
  const nodes=f.steps.map((s,i)=>{ const p=pos[s.id]; const c=`var(--t-${s.tipo})`; const pend=pendForStep(s.id).length; const sel=ui.drawer&&ui.drawer.id===s.id;
    const t=(i+1)+". "+(s.titulo||"sem título"); const tt=t.length>36?t.slice(0,35)+"…":t;
    const shape = s.tipo==="decisao" ? `<path d="M${X} ${p.y} L${X+NW/2} ${p.y+p.h/2} L${X} ${p.y+p.h} L${X-NW/2} ${p.y+p.h/2} Z" fill="var(--surface)" stroke="${c}" stroke-width="${sel?3.2:1.8}"/>`
      : `<rect x="${X-NW/2}" y="${p.y}" width="${NW}" height="${p.h}" rx="${["inicio","fim"].includes(s.tipo)?p.h/2:12}" fill="var(--surface)" stroke="${c}" stroke-width="${sel?3.2:1.8}"/>`;
    const sub = [s.responsavel, s.prazo].filter(Boolean).join(" · ");
    return `<g class="mnode" data-act="openStep" data-id="${s.id}">${shape}<text x="${X}" y="${p.y+p.h/2+(sub&&s.tipo!=="decisao"?-1:5)}" text-anchor="middle" font-size="14" font-weight="600" fill="var(--fg)">${esc(tt)}</text>${sub&&s.tipo!=="decisao"?`<text x="${X}" y="${p.y+p.h/2+16}" text-anchor="middle" font-size="11.5" fill="var(--muted)">${esc(sub)}</text>`:""}${pend?`<circle cx="${X+NW/2-6}" cy="${p.y+6}" r="7" fill="var(--danger)"/>`:s.aprov==="aprovado"?`<circle cx="${X+NW/2-6}" cy="${p.y+6}" r="7" fill="var(--ok)"/>`:""}</g>`; }).join("");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Figtree, Segoe UI, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--t-decisao)"/></marker></defs>${edges}${extra}${nodes}</svg>`;
}

    if(x.criar){ if(r.criado && findStep(r.criado)) acts+=`<button class="btn sm" data-act="openStep" data-id="${r.criado}">Ver o passo criado</button>`; else acts+=`<button class="btn sm primary" data-act="criarSug" data-f="${x.id}">+ Criar este passo</button>`; }
    if(x.criarFluxo){ if(r.criado && flowById(r.criado)) acts+=`<button class="btn sm" data-act="goFlow" data-id="${r.criado}">Abrir o fluxo criado</button>`; else acts+=`<button class="btn sm primary" data-act="criarFluxo" data-f="${x.id}">+ Criar este fluxo</button>`; }
    if(x.custom && isApprover()) acts+=`<button class="btn sm ghost danger" data-act="fbDel" data-f="${x.id}">Excluir</button>`;
    return `<div class="card" style="box-shadow:none;padding:14px;gap:8px">
      <label class="check" style="font-weight:700;font-size:15px;align-items:flex-start"><input type="checkbox" data-chg="fbFeito" data-f="${x.id}" ${done?"checked":""} style="margin-top:3px"><span style="${done?"text-decoration:line-through;color:var(--muted)":""}">${esc(x.titulo)}</span></label>
      <p class="pre" style="font-size:14px">${esc(x.texto)}</p><small class="muted">${esc(x.autor||"")}${x.data?" · "+esc(x.data):""}</small>
      <div class="row">${acts}</div>${threadHtml(x.id)}</div>`; };
  return `<div class="dh"><div class="row"><span class="kind">Pendências</span><span class="grow"></span>${isApprover()?`<button class="btn sm" data-act="fbNew">+ Nova pendência</button>`:""}<button class="iconbtn" data-act="closeDrawer" title="Fechar">${I.x}</button></div>
    <h2 style="font-size:22px">${ab.length} aberta${ab.length===1?"":"s"} · ${fe.length} resolvida${fe.length===1?"":"s"}</h2>
    ${ab.length?`<div><button class="btn primary" data-act="guideStart">${ic("play")} Começar o modo guiado</button></div>`:""}</div>
  <div class="db">${ab.map(item).join("") || `<div class="empty">Nenhuma pendência aberta.</div>`}
    ${fe.length?`<details class="more"><summary>Resolvidas (${fe.length})<span class="chev">${I.chev}</span></summary><div class="in">${fe.map(item).join("")}</div></details>`:""}</div>`;
}

/* ================= MODO GUIADO ================= */
function guideStart(){
  const np=pendOpen(); if(!np.length){ toast("Nenhuma pendência aberta."); return; }
  ui.guide=np[0].id; document.body.classList.add("guiding"); showGuide();
}
function guideStop(){ ui.guide=null; $("#guide").innerHTML=""; document.body.classList.remove("guiding"); }
function showGuide(){
  const np=pendOpen(); const x=FB().find(y=>y.id===ui.guide);
  if(!x || !np.length){ guideStop(); toast("Pendências resolvidas. Muito bem!"); render(); return; }
  const n=np.indexOf(x)+1; const auto=autoFeito(x); const r=S.retorno[x.id]||{};
  let main="";
  if(x.criar && !(r.criado && findStep(r.criado))) main=`<button class="btn primary" data-act="criarSug" data-f="${x.id}">+ Criar o passo agora</button>`;
  else if(x.criarFluxo && !(r.criado && flowById(r.criado))) main=`<button class="btn primary" data-act="criarFluxo" data-f="${x.id}">+ Criar o fluxo agora</button>`;
  else if(x.step && findStep(x.step)) main=`<button class="btn primary" data-act="openStep" data-id="${x.step}" data-field="${x.foco||""}">Mostrar onde</button>`;
  else if(x.flow && flowById(x.flow)) main=`<button class="btn primary" data-act="goFlow" data-id="${x.flow}">Abrir o fluxo</button>`;
  $("#guide").innerHTML = `<div class="guide" role="dialog" aria-label="Modo guiado"><div class="gh">Pendência ${n} de ${np.length}<span class="gdots">${np.slice(0,12).map(y=>`<i class="${y.id===x.id?"on":""}"></i>`).join("")}</span></div>
    <h3>${esc(x.titulo)}</h3><p>${esc(x.texto)}</p>
    <div class="row">${main}<button class="btn ${auto?"ok":""}" data-act="gNext">${auto?"Feito ✓ · próxima":"Marcar como feita · próxima"}</button><button class="btn ghost" data-act="gSkip">Pular</button><span class="grow"></span><button class="btn ghost" data-act="gExit">Sair</button></div></div>`;
  if(x.step && findStep(x.step) && !(ui.drawer && ui.drawer.id===x.step)) openStep(x.step, x.foco||null);
}
function guideNext(mark){
  const x=FB().find(y=>y.id===ui.guide);
  if(x && mark){ snap(); ret(x.id).feito=true; logA("resolveu a pendência “"+x.titulo+"”"); save(); }
  const np=pendOpen(); const all=FB(); const after = x ? all.slice(all.indexOf(x)+1).find(y=>np.includes(y)) || np.find(y=>y!==x) : np[0];
  if(!after){ guideStop(); closeDrawer(true); render(); toast("Pendências resolvidas. O Gabriel vai ver isso."); return; }
  ui.guide=after.id; showGuide(); render();
}
function refreshGuide(){ if(ui.guide){ const b=$('#guide [data-act="gNext"]'); const x=FB().find(y=>y.id===ui.guide); if(b && x && autoFeito(x)){ b.classList.add("ok"); b.textContent="Feito ✓ · próxima"; } } }

/* ================= OCORRÊNCIAS ================= */
function ocCount(stepId, dias){ const lim=Date.now()-(dias||30)*864e5; return S.ocorrencias.filter(o=>o.step===stepId && o.t>=lim).length; }
function ocNova(stepId, atId){
  const at = atId ? S.atendimentos.find(a=>a.id===atId) : null;
  const f = at ? flowById(at.flow) : stepId ? findStep(stepId).f : flow();
  if(!f || !f.steps.length){ toast("Crie um fluxo com passos primeiro."); return; }
  const sel = stepId || (at?at.step:"");
  modal("Aconteceu algo fora do fluxo", `<p class="muted" style="font-size:14px">Registre em poucos segundos. Isso mostra onde o fluxo precisa melhorar.</p>
    <div class="df"><label>Em qual passo</label><select id="ocStep">${f.steps.map((s,i)=>`<option value="${s.id}" ${s.id===sel?"selected":""}>${i+1}. ${esc(s.titulo||"sem título")}</option>`).join("")}</select></div>
    <div class="df"><label>O que aconteceu</label><div class="pick" id="ocPick">${MOTIVOS_OC.map((m,i)=>`<button type="button" class="${i===0?"on":""}" data-ocm="${esc(m)}">${esc(m)}</button>`).join("")}</div></div>
    <div class="df"><label>Cliente <em>(só iniciais)</em></label><input id="ocCli" value="${at?esc(at.nome):""}" placeholder="Ex.: M.S."></div>
    <div class="df"><label>Detalhes <em>(opcional)</em></label><textarea id="ocObs" style="min-height:60px"></textarea></div>`,
    [{label:"Cancelar"},{label:"Registrar", cls:"primary", fn:()=>{
      const mot = ($("#ocPick .on")||{}).dataset?.ocm || MOTIVOS_OC[0];
      snap(); S.ocorrencias.unshift({id:uid(), t:Date.now(), quem:ui.me||"?", flow:f.id, step:$("#ocStep").value, motivo:mot, cliente:$("#ocCli").value.trim(), obs:$("#ocObs").value.trim(), at:at?at.id:""});
      logA("registrou ocorrência “"+mot+"” "+noPasso($("#ocStep").value), f.id); commit(); renderDrawer(); toast("Ocorrência registrada.");
    }}]);
}

  let h=`<div class="phead"><div><h1>Clientes</h1><p>Cada cliente vira um cartão que anda pelos passos do fluxo. Arraste o cartão ou clique para ver a próxima ação.</p></div>
    <div class="row"><button class="btn primary" data-act="atNovo">${ic("plus")} Novo cliente</button></div></div>

    return `<section class="kcol t-${s.tipo}" data-col="${s.id}"><header><span class="sn">${i+1}</span><b title="${esc(s.titulo)}">${esc(s.titulo||"sem título")}</b><span class="kc">${cards.length}</span></header>
      ${cards.map(a=>{ const st=slaState(a); return `<div class="acard ${st}" role="button" tabindex="0" draggable="true" data-act="atOpen" data-id="${a.id}" data-adrag="${a.id}"><b>${esc(a.nome)}</b><span>${a.resp?esc(a.resp)+" · ":""}há ${fmtDur(Date.now()-(a.movido||a.criado))}</span>${st==="late"?`<em>atrasado</em>`:st==="soon"?`<em class="s">quase no prazo</em>`:""}</div>`; }).join("") || `<p class="kempty">—</p>`}
    </section>`; }).join("")}</div>`;
  if(ui.showEnc){ const enc=S.atendimentos.filter(a=>a.flow===f.id && a.status!=="ativo").sort((a,b)=>(b.encerradoEm||0)-(a.encerradoEm||0));
    h += `<section class="card" style="margin-top:14px"><h2>Encerrados <span class="count">${enc.length}</span></h2>${enc.length?`<ul class="loglist">${enc.map(a=>`<li><span>${esc(fmtT(a.encerradoEm))}</span><button class="btn sm ghost" data-act="atOpen" data-id="${a.id}">${esc(a.nome)}</button><span class="bdg ${a.status==="fechou"?"val":a.status==="nao_fechou"?"pend":"prop"}">${a.status==="fechou"?"fechou":a.status==="nao_fechou"?"não fechou":"arquivado"}</span>${a.motivoNao?`<small class="muted">${esc(a.motivoNao)}</small>`:""}</li>`).join("")}</ul>`:`<p class="muted">Nenhum ainda.</p>`}</section>`; }
  return h;

/* ================= GESTÃO ================= */
const GTABS=[["painel","Painel"],["reuniao","Reunião semanal"],["trilha","Trilha"],["biblioteca","Biblioteca"],["manual","Manual (POP)"],["automacao","Automação"],["historico","Histórico"],["dados","Dados e arquivo"]];
function viewGestao(){
  const body = {painel:gPainel, reuniao:gReuniao, trilha:gTrilha, biblioteca:gBiblioteca, manual:gManual, automacao:gAuto, historico:gHistorico, dados:gDados}[ui.gtab] || gPainel;
  return `<div class="phead noprint"><div><h1>Gestão</h1><p>Números, reunião, treinamento, materiais e dados.</p></div></div>
    <nav class="gtabs noprint">${GTABS.map(([k,n])=>`<button class="${ui.gtab===k?"on":""}" data-gtab="${k}">${n}</button>`).join("")}</nav>${body()}`;
}
function barRows(rows, max, fmt){ max=max||Math.max(1,...rows.map(r=>r.v)); return `<div class="prows">${rows.map(r=>`<div class="prow"><span class="pl" title="${esc(r.l)}">${esc(r.l)}</span><span class="pb"><i style="width:${Math.round(100*r.v/max)}%;${r.c?"background:"+r.c:""}"></i></span><b>${fmt?fmt(r.v,r):r.v}</b></div>`).join("")}</div>`; }
function gPainel(){
  const f=flow(); const desde=Date.now()-ui.per*864e5;
  const A=S.atendimentos.filter(a=>a.criado>=desde && (!f||a.flow===f.id));
  const fech=A.filter(a=>a.status==="fechou").length, nao=A.filter(a=>a.status==="nao_fechou").length;
  const taxa=(fech+nao)?Math.round(100*fech/(fech+nao))+"%":"—"; const atr=S.atendimentos.filter(a=>a.status==="ativo"&&slaState(a)==="late"&&(!f||a.flow===f.id)).length;
  let h=`<div class="row" style="margin-bottom:12px"><span class="muted">Fluxo:</span>${S.flows.map(g=>`<button class="fchip ${f&&g.id===f.id?"on":""}" data-flow="${g.id}" style="padding:4px 12px;font-size:13px">${esc(g.nome)}</button>`).join("")}<span class="grow"></span>
    <select class="mini" data-chg="per">${[7,30,90,365].map(n=>`<option value="${n}" ${ui.per===n?"selected":""}>últimos ${n} dias</option>`).join("")}</select></div>
  <div class="kpis" style="margin-bottom:14px"><div class="kpi"><span>Clientes iniciados</span><b>${A.length}</b></div><div class="kpi"><span>Em andamento</span><b>${A.filter(a=>a.status==="ativo").length}</b></div><div class="kpi g"><span>Fecharam</span><b>${fech}</b></div><div class="kpi r"><span>Não fecharam</span><b>${nao}</b></div><div class="kpi"><span>Taxa de fechamento</span><b>${taxa}</b></div><div class="kpi ${atr?"r":""}"><span>Atrasados agora</span><b>${atr}</b></div></div><div class="pgrid">`;
  if(f&&f.steps.length){
    const funil=f.steps.map((s,i)=>({l:(i+1)+". "+(s.titulo||""), v:A.filter(a=>a.hist.some(x=>x.step===s.id)).length}));
    const acc={}; f.steps.forEach(s=>acc[s.id]=[]); A.forEach(a=>{ for(let k=0;k<a.hist.length;k++){ const x=a.hist[k]; if(!acc[x.step]) continue; const fim=a.hist[k+1]?a.hist[k+1].t:(a.status==="ativo"?Date.now():null); if(fim) acc[x.step].push(fim-x.t); } });
    const tempos=f.steps.map((s,i)=>{ const arr=acc[s.id]; const m=arr.length?arr.reduce((x,y)=>x+y,0)/arr.length:0; const sla=parseFloat(String(s.slaHoras).replace(",","."))||0; return {l:(i+1)+". "+(s.titulo||""), v:m/36e5, n:arr.length, c:sla&&m/36e5>sla?"var(--danger)":null}; });
    h+=`<section class="card"><h3>Quantos chegaram em cada passo</h3>${A.length?barRows(funil,A.length):`<p class="muted">Sem clientes no período. Use a área Clientes.</p>`}</section>
      <section class="card"><h3>Tempo médio em cada passo</h3>${tempos.some(t=>t.n)?barRows(tempos,0,v=>fmtDur(v*36e5)):`<p class="muted">Aparece quando os clientes começarem a andar no quadro.</p>`}<small class="muted">Vermelho: acima do aviso de atraso do passo.</small></section>`;
  }
  const mot={}; S.atendimentos.filter(a=>a.status==="nao_fechou"&&a.encerradoEm>=desde&&(!f||a.flow===f.id)).forEach(a=>mot[a.motivoNao]=(mot[a.motivoNao]||0)+1);
  const O=S.ocorrencias.filter(o=>o.t>=desde&&(!f||o.flow===f.id)); const os={}, om={}; O.forEach(o=>{ const k=stepRef(o.step).replace(/^o p/,"P"); os[k]=(os[k]||0)+1; om[o.motivo]=(om[o.motivo]||0)+1; });
  const rows=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([l,v])=>({l,v}));
  h+=`<section class="card"><h3>Por que não fecharam</h3>${Object.keys(mot).length?barRows(rows(mot)):`<p class="muted">Nenhum “não fechou” no período.</p>`}</section>
    <section class="card"><h3>Onde o fluxo quebra</h3>${O.length?barRows(rows(os)):`<p class="muted">Nenhuma ocorrência. Use “Aconteceu algo”.</p>`}</section>
    <section class="card"><h3>Ocorrências por motivo</h3>${O.length?barRows(rows(om)):`<p class="muted">—</p>`}</section>
    <section class="card"><h3>Últimas ocorrências</h3>${O.length?`<ul class="loglist">${O.slice(0,10).map(o=>`<li><span>${esc(fmtT(o.t))}</span><b>${esc(o.quem)}</b> ${esc(o.motivo)} · ${esc(stepRef(o.step))}${o.cliente?" · "+esc(o.cliente):""}${o.obs?` — <i>${esc(o.obs)}</i>`:""}</li>`).join("")}</ul>`:`<p class="muted">—</p>`}</section></div>`;
  return h;
}
function pautaText(){
  const sem=Date.now()-7*864e5; const L=["PAUTA DA REUNIÃO SEMANAL — "+hoje(),""];
  const ab=pendOpen(); L.push("1. Pendências abertas ("+ab.length+")"); ab.slice(0,12).forEach(x=>L.push("   - "+x.titulo)); L.push("");
  const rev=[]; S.flows.forEach(f=>f.steps.forEach((s,i)=>{ if(s.aprov==="revisao") rev.push(f.nome+" · passo "+(i+1)+" · "+(s.titulo||"")); })); L.push("2. Passos aguardando validação ("+rev.length+")"); rev.forEach(x=>L.push("   - "+x)); L.push("");
  const id=S.ideias.filter(i=>i.status==="nova"||i.status==="discussao").sort((a,b)=>b.votos.length-a.votos.length); L.push("3. Ideias para decidir ("+id.length+")"); id.slice(0,10).forEach(i=>L.push("   - "+i.titulo+" ("+i.quem+", "+i.votos.length+" apoio"+(i.votos.length===1?"":"s")+")")); L.push("");
  const oc=S.ocorrencias.filter(o=>o.t>=sem); const cnt={}; oc.forEach(o=>{ const k=stepRef(o.step)+" — "+o.motivo; cnt[k]=(cnt[k]||0)+1; }); L.push("4. Ocorrências da semana ("+oc.length+")"); Object.entries(cnt).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>L.push("   - "+v+"x "+k)); L.push("");
  const atr=S.atendimentos.filter(a=>a.status==="ativo"&&slaState(a)==="late"); L.push("5. Clientes atrasados ("+atr.length+")"); atr.forEach(a=>L.push("   - "+a.nome+" · "+stepRef(a.step))); L.push("");
  const fe=S.atendimentos.filter(a=>a.encerradoEm>=sem); L.push("6. Resultado da semana: "+fe.filter(a=>a.status==="fechou").length+" fecharam · "+fe.filter(a=>a.status==="nao_fechou").length+" não fecharam"); fe.filter(a=>a.status==="nao_fechou").forEach(a=>L.push("   - "+a.nome+": "+a.motivoNao)); L.push("");
  const duv=[]; S.flows.forEach(f=>f.steps.forEach((s,i)=>{ if(s.duvida.trim()) duv.push(f.nome+" · passo "+(i+1)+": "+s.duvida); })); L.push("7. Dúvidas da equipe ("+duv.length+")"); duv.forEach(x=>L.push("   - "+x)); L.push("");
  const mis=S.trilha.missoes.filter(m=>!m.feito); L.push("8. Trilha: missões pendentes ("+mis.length+")"); mis.forEach(m=>L.push("   - "+m.titulo)); L.push("","9. Decisões e próximos passos:","   - ");
  return L.join("\n");
}

        const theirs=JSON.parse(r.dados||"null")||JSON.parse(JSON.stringify(S));
        const b0=base?JSON.parse(base):theirs;
        const m=normalize(merge3(b0, JSON.parse(JSON.stringify(S)), theirs));

async function restaurarCopia(id){

async function salvarNoDrive(nome, conteudo, tipo){

let palSel=0, palItems=[];
function openPalette(){ $("#pal").innerHTML=`<div class="pal-bg" data-act="closePal"><div class="pal" role="dialog" aria-label="Buscar"><input id="palIn" placeholder="Digite: cobrar, viabilidade, M.S., mensagem…" autocomplete="off"><ul id="palList"></ul></div></div>`; $("#palIn").focus(); palFilter(""); }
function closePal(){ $("#pal").innerHTML=""; }
function palFilter(q){
  q=q.trim().toLowerCase(); const it=[]; const m=x=>!q||x.toLowerCase().includes(q);
  [["Hoje","hoje"],["Clientes","clientes"],["Fluxos","fluxos"],["Ideias","ideias"],["Gestão","gestao"]].forEach(([n,v])=>{ if(m(n)) it.push({t:"Ir para "+n, k:"Página", go:()=>go(v)}); });
  GTABS.forEach(([k,n])=>{ if(q&&m(n)) it.push({t:n, k:"Gestão", go:()=>{ ui.gtab=k; go("gestao"); }}); });
  S.flows.forEach(f=>{ if(q&&m(f.nome)) it.push({t:"Fluxo "+f.nome, k:"Fluxo", go:()=>{ S.ativo=f.id; ui.fmode="lista"; go("fluxos"); }}); f.steps.forEach((s,i)=>{ if(m(s.titulo+" "+s.descricao+" "+s.mensagem)) it.push({t:(i+1)+". "+(s.titulo||"sem título"), k:"Passo · "+f.nome, go:()=>openStep(s.id)}); }); });
  S.biblioteca.mensagens.forEach(x=>{ if(m(x.titulo+" "+x.texto)) it.push({t:"Mensagem: "+(x.titulo||"sem título"), k:"Enter copia", go:()=>copyText(x.texto, "Mensagem “"+x.titulo+"” copiada.")}); });
  S.atendimentos.forEach(a=>{ if(m(a.nome+" "+(a.area||""))) it.push({t:"Cliente "+a.nome, k:a.status==="ativo"?"Em andamento":"Encerrado", go:()=>{ S.ativo=a.flow; ui.view="clientes"; render(); openDrawer("at",a.id); }}); });
  S.ideias.forEach(i=>{ if(m(i.titulo+" "+i.texto)) it.push({t:"Ideia: "+i.titulo, k:"Ideias", go:()=>{ ui.view="ideias"; render(); openDrawer("ideia",i.id); }}); });
  palItems=it.slice(0,50); palSel=0; drawPal();
}
function drawPal(){ const l=$("#palList"); if(!l) return; l.innerHTML=palItems.map((x,i)=>`<li class="${i===palSel?"on":""}" data-pi="${i}">${esc(x.t)}<small>${esc(x.k)}</small></li>`).join("")||`<li class="muted">Nada encontrado.</li>`; const on=l.querySelector(".on"); if(on) on.scrollIntoView({block:"nearest"}); }

function nextVer(f){ const v=f.versoes[f.versoes.length-1]; if(!v) return "1.0"; const [a,b]=v.n.split(".").map(Number); return a+"."+(b+1); }
function flowMenu(){
  const f=flow(); if(!f) return;

    ${isApprover()?`<button class="btn primary" data-mact="publicar">Publicar nova versão (v${nextVer(f)})</button>`:""}
    ${isApprover()&&f.steps.some(s=>s.aprov==="revisao")?`<button class="btn ok" data-mact="aprovarTodos">Validar todos os passos aguardando</button>`:""}
    <button class="btn" data-mact="flowDup">Duplicar este fluxo</button>

function publicar(){
  const f=flow(); if(!isApprover()) return; const v=f.versoes[f.versoes.length-1];
  const mud=S.log.filter(l=>l.f===f.id&&(!v||l.t>v.t)).reverse(); const nao=f.steps.filter(s=>s.aprov!=="aprovado").length;
  modal("Publicar versão v"+nextVer(f), `${nao?`<p class="warnbox">${nao} passo(s) ainda não validados. Eles entram marcados como “não validado”.</p>`:""}
    <div class="df"><label>O que mudou nesta versão</label><textarea id="pubNotas" style="min-height:160px">${esc(mud.slice(-25).map(l=>"• "+l.quem+" "+l.txt).join("\n")||"Primeira versão oficial.")}</textarea></div>`,
    [{label:"Cancelar"},{label:"Publicar v"+nextVer(f), cls:"primary", fn:()=>{ snap(); const n=nextVer(f); f.versoes.push({id:uid(), n, t:Date.now(), por:ui.me, notas:$("#pubNotas").value.trim(), steps:clone(f.steps), nome:f.nome, canal:f.canal, descricao:f.descricao}); logA("publicou a versão v"+n, f.id); commit(); toast("Versão v"+n+" publicada. Ela é a base do Manual."); }}]);

function renderPedidos(force){

  const sig = ui.pd.filtro+"|"+ui.me+"|"+JSON.stringify(lista);
  $$("#pdPanel [data-pdf]").forEach(b=>b.classList.toggle("on", b.dataset.pdf===ui.pd.filtro));

};

/* ================= ASSISTENTE (conversa com a IA) ================= */
function renderAssist(force){
  const L=$("#pdList"); if(!L) return;
  const msgs=S.conversaIA||[];
  const sig="IA|"+JSON.stringify(msgs)+ui.pd.iaBusy;
  if(!force && sig===ui.pd.sig) return; ui.pd.sig=sig;
  const near=L.scrollHeight-L.scrollTop-L.clientHeight<80;
  L.innerHTML = msgs.length
    ? msgs.map(m=>`<div class="as-m ${m.role==="user"?"u":"a"}"><div class="as-h"><b>${m.role==="user"?esc(m.quem):"Assistente"}</b> <span class="muted pd-t">${esc(fmtT(m.t))}</span></div><div class="as-txt">${esc(m.txt)}</div>${m.role==="assistant"?`<button class="lnk" data-act="asCopiar" data-id="${m.id}">${ic("copy",13)} Copiar resposta</button>`:""}</div>`).join("")
      + (ui.pd.iaBusy?`<div class="as-m a muted">Pensando…</div>`:"")
    : `<div class="pd-empty">Pergunte o que quiser sobre o dia a dia.<br><span class="muted">Ex.: “o que é uma procuração?” ou cole o que o cliente perguntou e eu sugiro a resposta.</span></div>`;
  if(near||force) L.scrollTop=L.scrollHeight;
}
function asEnviar(txtIn){
  const ta=$("#pdText"); const txt=String(txtIn!=null?txtIn:(ta?ta.value:"")).trim();
  if(!txt||ui.pd.iaBusy) return;
  if(!ui.me){ whoModal(false); toast("Antes, escolha quem é você."); return; }
  snap(); S.conversaIA.push({id:uid(), t:Date.now(), quem:ui.me, role:"user", txt});
  if(txtIn==null && ta) ta.value=""; ui.pd.iaBusy=true; save(); render(); renderPedidos(true);
  const hist=[]; S.conversaIA.slice(-12).forEach(x=>{ const c = x.role==="user" ? x.quem+": "+x.txt : x.txt; const last=hist[hist.length-1]; if(last && last.role===x.role) last.content+="\n"+c; else hist.push({role:x.role, content:c}); });
  while(hist.length && hist[0].role!=="user") hist.shift();
  const fim = t => { ui.pd.iaBusy=false; S.conversaIA.push({id:uid(), t:Date.now(), quem:"Assistente", role:"assistant", txt:t}); save(); render(); renderPedidos(true); };

function lmIsoDate(iso){ const p=iso.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function lmDue(l, iso){
  if(!l.ativo || !l.quando || iso<l.quando) return false;
  const d=lmIsoDate(iso), w=d.getDay(), q=lmIsoDate(l.quando);
  if(l.repetir==="nao") return iso===l.quando;
  if(l.repetir==="diario") return true;
  if(l.repetir==="uteis") return w>=1 && w<=5;
  if(l.repetir==="semanal") return w===q.getDay();
  if(l.repetir==="mensal"){ const ult=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); return d.getDate()===Math.min(q.getDate(), ult); }
  return false;
}
function lmFeito(l, iso){ return !!(l.feitoEm && l.feitoEm[iso]); }
function lmProx(l, de){ const d=lmIsoDate(de); for(let i=0;i<400;i++){ const iso=isoDia(d); if(lmDue(l, iso) && !lmFeito(l, iso)) return iso; d.setDate(d.getDate()+1); } return ""; }

function lmVisivel(l){ return lmMaster() || isApprover() || l.para==="Todos" || l.para===ui.me || l.quem===ui.me; }

async function sbCall(fn, a){
  if(!SB) throw new Error("sem_config");
  const ok = r=>{ if(r.error) throw r.error; return r.data; };
  switch(fn){
    case "carregar": { const d=ok(await SB.from("estado").select("rev,dados").eq("id",1).maybeSingle()); return {rev:d?Number(d.rev):0, dados:d&&d.dados?JSON.stringify(d.dados):null}; }
    case "estado": { const d=ok(await SB.from("estado").select("rev,quem").eq("id",1).maybeSingle()); return {rev:d?Number(d.rev):0, quem:d?(d.quem||""):""}; }
    case "salvar": { const r=ok(await SB.rpc("salvar_estado", {p_dados:JSON.parse(a[0]), p_base:Number(a[1])})); if(r && r.conflito) return {conflito:true, rev:Number(r.rev), dados:r.dados?JSON.stringify(r.dados):null}; return {ok:true, rev:Number(r.rev)}; }
    case "listarCopias": { const d=ok(await SB.from("copias").select("id,em,quem,rev").order("em",{ascending:false}).limit(80)); return d.map(c=>({id:String(c.id), em:c.em, nome:"copia-"+String(c.em).slice(0,16).replace("T"," ")+(c.quem?" · "+c.quem:"")+".json"})); }
    case "lerCopia": { const d=ok(await SB.from("copias").select("dados").eq("id",Number(a[0])).single()); return JSON.stringify(d.dados); }
    default: throw new Error("indisponivel");
  }
}

function soGestor(obj, keys){ if(!obj) return; keys.forEach(k=>{ const f=obj[k]; if(typeof f!=="function" || f.__guard) return; const g=function(...x){ if(!isApprover()){ toast("Só o Gabriel, o Alan ou o Evaldo podem fazer isso. Se precisar, peça pela caixa de Pedidos."); return; } return f.apply(this,x); }; g.__guard=true; obj[k]=g; }); }
function soMaster(obj, keys){ if(!obj) return; keys.forEach(k=>{ const f=obj[k]; if(typeof f!=="function" || f.__guardM) return; const g=function(...x){ if(ui.papel!=="master"){ toast("Só o master (Gabriel) pode fazer isso."); return; } return f.apply(this,x); }; g.__guardM=true; obj[k]=g; }); }

function resolve(k){
  const p=k.split(":");
  const find1=(arr,id)=>arr.find(x=>x.id===id);
  switch(p[0]){
    case "flow": { const f=flowById(p[1]); return f?[f,p[2]]:null; }
    case "step": { const fs=findStep(p[1]); return fs?[fs.s,p[2],fs.s]:null; }
    case "item": { const fs=findStep(p[1]); const c=fs&&find1(fs.s.coleta,p[2]); return c?[c,p[3],fs.s]:null; }
    case "ramo": { const fs=findStep(p[1]); const r=fs&&find1(fs.s.ramos,p[2]); return r?[r,p[3],fs.s]:null; }
    case "msg": { const m=find1(S.biblioteca.mensagens,p[1]); return m?[m,p[2]]:null; }
    case "lista": { const l=find1(S.biblioteca.listas,p[1]); return l?[l,p[2]]:null; }
    case "litem": { const l=find1(S.biblioteca.listas,p[1]); const i=l&&find1(l.itens,p[2]); return i?[i,p[3]]:null; }
    case "mis": { const m=find1(S.trilha.missoes,p[1]); return m?[m,p[2]]:null; }
    case "cen": { const m=find1(S.trilha.cenarios,p[1]); return m?[m,p[2]]:null; }
    case "comp": { const m=find1(S.trilha.comp,p[1]); return m?[m,p[2]]:null; }
    case "ideia": { const m=getIdeia(p[1]); return m?[m,p[2]]:null; }
    case "at": { const m=getAt(p[1]); return m?[m,p[2]]:null; }
  }
  return null;
}
const CAMPO = {titulo:"o título", responsavel:"quem faz", ferramenta:"onde", prazo:"o prazo", descricao:"como fazer", mensagem:"a mensagem", entregavel:"a entrega", planoB:"o plano B", duvida:"a dúvida", slaHoras:"o aviso de atraso", nome:"o nome", canal:"o canal", notas:"as observações"};
let editStart=null;
document.addEventListener("focusin", e=>{ const k=e.target.dataset&&e.target.dataset.k; if(k){ pendingSnap=true; editStart={k, v:e.target.value}; } });
document.addEventListener("focusout", e=>{
  const k=e.target.dataset&&e.target.dataset.k; if(!k||!editStart||editStart.k!==k) return; const changed=editStart.v!==e.target.value; editStart=null; if(!changed) return;
  const p=k.split(":");
  if(p[0]==="step" && CAMPO[p[2]]) logA("alterou "+CAMPO[p[2]]+" "+noPasso(p[1]));
  else if(p[0]==="item"||p[0]==="ramo") logA("alterou "+(p[0]==="item"?"o que pegar":"uma resposta")+" "+noPasso(p[1]));
  else if(p[0]==="flow" && CAMPO[p[2]]) logA("alterou "+CAMPO[p[2]]+" do fluxo", p[1]);
  save();
});
document.addEventListener("input", e=>{

  const r=resolve(k); if(!r) return;

  if($("#pal").innerHTML){
    if(e.key==="Escape") return closePal();
    if(e.key==="ArrowDown"){ e.preventDefault(); palSel=Math.min(palItems.length-1,palSel+1); drawPal(); }
    if(e.key==="ArrowUp"){ e.preventDefault(); palSel=Math.max(0,palSel-1); drawPal(); }
    if(e.key==="Enter" && palItems[palSel]){ e.preventDefault(); const x=palItems[palSel]; closePal(); x.go(); }
    return;
  }
  if(e.key==="Escape"){ if($("#modalRoot").innerHTML) return closeModal(); if(ui.drawer) return closeDrawer(); if(ui.guide) return guideStop(); }
  if(e.key==="Enter" && e.target.dataset && e.target.dataset.enter){ e.preventDefault(); const fn=ACT[e.target.dataset.enter]; if(fn) fn(e.target); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z" && !e.shiftKey && !typing){ e.preventDefault(); undo(); return; }
  if((e.key==="Enter"||e.key===" ") && !typing && e.target.matches && e.target.matches("[role=button]")){ e.preventDefault(); e.target.click(); }
  if(ui.view==="fluxos" && ui.fmode==="desenho" && ui.dsel && !typing && !$("#modalRoot").innerHTML && (e.key==="Delete"||e.key==="Backspace")){
    e.preventDefault(); const d=DD(); snap();
    if(ui.dsel.t==="n"){ d.nodes=d.nodes.filter(k=>k.id!==ui.dsel.id); d.edges=d.edges.filter(k=>k.de!==ui.dsel.id&&k.para!==ui.dsel.id); }
    if(ui.dsel.t==="e") d.edges=d.edges.filter(k=>k.id!==ui.dsel.id);
    if(ui.dsel.t==="t") d.tracos=d.tracos.filter(k=>k.id!==ui.dsel.id);
    ui.dsel=null; save(); redraw();
  }
});

/* ================= ARRASTAR (passos, clientes, ideias) ================= */
let dragKind=null, dragId=null;
document.addEventListener("dragstart", e=>{
  const s=e.target.closest&&e.target.closest("[data-drag],[data-adrag],[data-idrag]"); if(!s) return;
  dragKind = s.dataset.drag?"step":s.dataset.adrag?"at":"ideia"; dragId = s.dataset.drag||s.dataset.adrag||s.dataset.idrag;
  e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain", dragId); s.classList.add("dragging");
});
document.addEventListener("dragend", ()=>{ $$(".dragging").forEach(x=>x.classList.remove("dragging")); $$(".dropbefore,.over").forEach(x=>x.classList.remove("dropbefore","over")); dragKind=null; });
document.addEventListener("dragover", e=>{
  if(!dragKind) return;
  const tgt = dragKind==="step" ? e.target.closest(".srow,.addlast") : dragKind==="at" ? e.target.closest(".kcol") : e.target.closest(".icol");
  if(!tgt) return; e.preventDefault();
  $$(".dropbefore,.over").forEach(x=>{ if(x!==tgt) x.classList.remove("dropbefore","over"); });
  tgt.classList.add(dragKind==="step"&&tgt.classList.contains("srow")?"dropbefore":"over");
});
document.addEventListener("drop", e=>{
  if(!dragKind) return;
  if(dragKind==="step"){
    const tgt=e.target.closest(".srow,.addlast"); if(!tgt) return; e.preventDefault(); const f=flow(); const from=idx(f,dragId); if(from<0) return;
    snap(); const [m]=f.steps.splice(from,1);
    if(tgt.classList.contains("addlast")) f.steps.push(m); else { const to=idx(f,tgt.dataset.drag); f.steps.splice(to<0?f.steps.length:to,0,m); }
    logA("mudou a ordem: "+stepRef(m.id), f.id); save(); render(); toast("“"+(m.titulo||"Passo")+"” agora é o passo "+(idx(f,m.id)+1)+".", ()=>undo());
  } else if(dragKind==="at"){
    const col=e.target.closest(".kcol"); if(!col) return; e.preventDefault(); const a=getAt(dragId); if(a && a.step!==col.dataset.col){ snap(); moveAt(a, col.dataset.col, "arrastado no quadro"); save(); render(); toast(a.nome+" foi para “"+(findStep(col.dataset.col).s.titulo||"")+"”."); }
  } else {
    const col=e.target.closest(".icol"); if(!col) return; e.preventDefault(); const i=getIdeia(dragId); if(i && i.status!==col.dataset.icol){ snap(); i.status=col.dataset.icol; logA("moveu a ideia “"+i.titulo+"” para "+IDEIA_ST.find(s=>s[0]===i.status)[1]); save(); render(); }
  }
  dragKind=null;
});
function bindStepDrag(){}

/* ================= ARQUIVOS (restaurar, modelo) ================= */
$("#fileIn").addEventListener("change", e=>{
  const file=e.target.files&&e.target.files[0]; if(!file) return; const mode=e.target.dataset.mode;
  const rd=new FileReader(); rd.onload=()=>{
    let j=null; try{ j=JSON.parse(rd.result); }catch(err){}
    if(mode==="modelo"){
      if(!j||j.tipo!=="modelo-de-fluxo"||!j.fluxo){ modal("Não é um modelo", `<p>Escolha um arquivo criado por “Exportar como modelo”.</p>`, [{label:"Ok", cls:"primary"}]); return; }
      snap(); const f=newFlow(j.fluxo.nome+" (modelo)", j.fluxo.canal); f.descricao=j.fluxo.descricao||""; const map={};
      f.steps=(j.fluxo.steps||[]).map(s=>{ const n=Object.assign(newStep(s.tipo), s); map[s.id]=n.id=uid(); n.coleta=(n.coleta||[]).map(c=>({id:uid(), texto:c.texto})); return n; });
      f.steps.forEach(s=>{ s.ramos=(s.ramos||[]).map(r=>({id:uid(), rotulo:r.rotulo, destino:map[r.destino]||(r.destino==="__fim"?"__fim":"")})); });
      S.flows.push(f); S.ativo=f.id; S=normalize(S); logA("importou o modelo “"+j.fluxo.nome+"”", f.id); ui.view="fluxos"; ui.fmode="lista"; commit(); toast("Modelo importado como fluxo novo.");
    } else {
      const d=normalize(j); if(!d){ modal("Não consegui abrir", `<p>Esse arquivo não é uma cópia do Mapa de Atendimento.</p>`, [{label:"Ok", cls:"primary"}]); return; }
      modal("Restaurar esta cópia?", `<p>Cópia de ${esc(fmtT(d.atualizadoEm))}, com ${d.flows.length} fluxo(s). Ela substitui os dados atuais${HAS_GS?" para todos":""}. Dá para desfazer logo depois.</p>`, [{label:"Cancelar"},{label:"Restaurar", cls:"primary", fn:()=>{ snap(); S=d; logA("restaurou uma cópia de arquivo"); persist(); render(); if(HAS_GS) pushNow(true); toast("Cópia restaurada."); }}]);
    }
  }; rd.readAsText(file);
});
window.addEventListener("beforeunload", ()=>{ clearTimeout(saveT); persist(); });

/* ================= INÍCIO ================= */
render();
updUndo();
if(persist()) setSave("Salvo neste computador", "");
if(!HAS_GS){ const bt=$("#boot"); if(bt) bt.remove(); }
authInit();
window.addEventListener("beforeunload", e=>{ if(HAS_GS && (srv.state==="pending"||srv.state==="saving"||srv.state==="offline")){ pushNow(false); e.preventDefault(); e.returnValue=""; } });
})();
</script>
